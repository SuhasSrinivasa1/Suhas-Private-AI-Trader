name: Build Research360 Intelligence APK

on:
  push:
    branches: [research360-android-v1]
    paths:
      - 'research360-android/**'
      - '.github/workflows/build-research360.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        shell: bash
        run: |
          set -euo pipefail
          cat research360-android/archive/part* > /tmp/r360.b64
          base64 -d /tmp/r360.b64 > /tmp/r360.tar.gz
          rm -rf research360-android/buildsrc /tmp/r360src
          mkdir -p research360-android/buildsrc /tmp/r360src
          tar -xzf /tmp/r360.tar.gz -C /tmp/r360src
          cp -a /tmp/r360src/. research360-android/buildsrc/
          test -f research360-android/buildsrc/app/src/main/AndroidManifest.xml

      - name: Apply final execution-safety patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research360-android/buildsrc/app/src/main/java/com/suhas/research360engine/EngineService.java')
          s=p.read_text()
          s=s.replace('GrowwClient.OrderResult r=groww.placeMarket(s.symbol,qty,product,"BUY");\n            double fill=awaitFillPrice(r.orderId,q.ltp);',
                      'GrowwClient.OrderResult r=groww.placeMarket(s.symbol,qty,product,"BUY");\n            ensureAccepted(r);\n            double fill=awaitFillPrice(r.orderId,q.ltp);\n            if(Double.isNaN(fill)) throw new IllegalStateException("Groww BUY was rejected/cancelled before fill");')
          s=s.replace('GrowwClient.OrderResult r=groww.placeMarket(t.symbol,t.qty,strategy.product(s),"SELL");\n            double fill=awaitFillPrice(r.orderId,q.ltp); close(t,s,fill,d.reason);',
                      'GrowwClient.OrderResult r=groww.placeMarket(t.symbol,t.qty,strategy.product(s),"SELL");\n            ensureAccepted(r);\n            double fill=awaitFillPrice(r.orderId,q.ltp);\n            if(Double.isNaN(fill)) throw new IllegalStateException("Groww SELL was rejected/cancelled before fill");\n            close(t,s,fill,d.reason);')
          s=s.replace('GrowwClient.OrderResult r=groww.placeMarket(t.symbol,t.qty,strategy.product(s),"SELL");double fill=awaitFillPrice(r.orderId,q.ltp);close(t,s,fill,"DISARMED_SAFETY_"+d.reason);',
                      'GrowwClient.OrderResult r=groww.placeMarket(t.symbol,t.qty,strategy.product(s),"SELL");ensureAccepted(r);double fill=awaitFillPrice(r.orderId,q.ltp);if(Double.isNaN(fill)) throw new IllegalStateException("Groww protective SELL was rejected/cancelled before fill");close(t,s,fill,"DISARMED_SAFETY_"+d.reason);')
          s=s.replace('    private double awaitFillPrice(String orderId,double fallback){',
                      '    private void ensureAccepted(GrowwClient.OrderResult r){\n        if(r==null||r.orderId==null||r.orderId.isEmpty())throw new IllegalStateException("Groww order was not accepted");\n        String st=r.status==null?"":r.status.toUpperCase(Locale.ROOT);\n        if(st.contains("REJECT")||st.contains("CANCEL")||st.contains("FAIL"))throw new IllegalStateException("Groww order "+st);\n    }\n\n    private double awaitFillPrice(String orderId,double fallback){')
          s=s.replace('if("REJECTED".equalsIgnoreCase(d.status)||"CANCELLED".equalsIgnoreCase(d.status))throw new IllegalStateException("Order "+d.status);',
                      'if("REJECTED".equalsIgnoreCase(d.status)||"CANCELLED".equalsIgnoreCase(d.status)||"FAILED".equalsIgnoreCase(d.status))return Double.NaN;')
          p.write_text(s)
          PY
          grep -q 'ensureAccepted' research360-android/buildsrc/app/src/main/java/com/suhas/research360engine/EngineService.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode private release signing key
        working-directory: research360-android/buildsrc
        shell: bash
        run: |
          set -euo pipefail
          base64 -d signing/research360-release.p12.b64 > signing/research360-release.p12
          chmod 600 signing/research360-release.p12 signing/signing.properties

      - name: Parser smoke test
        working-directory: research360-android/buildsrc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r360parser
          javac -d /tmp/r360parser app/src/main/java/com/suhas/research360engine/R360Parser.java
          cat >/tmp/TestParser.java <<'JAVA'
          import com.suhas.research360engine.R360Parser;
          public class TestParser {
            public static void main(String[] args){
              var a=R360Parser.parse("MOST Intraday Cash","Buy MAPMYINDIA at Rs.995.00 with a Target of Rs.1015.00 | Stop Loss: Rs.985.00",0);
              if(a.action!=R360Parser.Action.BUY || !"MAPMYINDIA".equals(a.symbol) || Math.abs(a.entry-995.0)>0.01) throw new RuntimeException("BUY parse failed");
              var b=R360Parser.parse("MOST Intraday Cash-loss","Our Buy Call of SOLARINDS on 17 Aug 2026 at Rs.20056.00 has now reached Rs.19934.00. Considering market conditions, it's advisable to exit the position. Call closed.",0);
              if(b.action!=R360Parser.Action.CLOSE || !"SOLARINDS".equals(b.symbol)) throw new RuntimeException("CLOSE parse failed");
              System.out.println("Parser smoke test passed");
            }
          }
          JAVA
          javac -cp /tmp/r360parser -d /tmp/r360parser /tmp/TestParser.java
          java -cp /tmp/r360parser TestParser

      - name: Build signed release APK
        working-directory: research360-android/buildsrc
        shell: bash
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Run Android lint
        working-directory: research360-android/buildsrc
        shell: bash
        run: gradle --no-daemon lintRelease

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK='research360-android/buildsrc/app/build/outputs/apk/release/Research360-Intelligence-S24-v1.0.0-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 15
          sha256sum "$APK" | tee research360-android/buildsrc/APK-SHA256-v1.0.0.txt

      - name: Upload signed APK package
        uses: actions/upload-artifact@v4
        with:
          name: Research360-Intelligence-S24-v1.0.0
          if-no-files-found: error
          retention-days: 30
          path: |
            research360-android/buildsrc/app/build/outputs/apk/release/Research360-Intelligence-S24-v1.0.0-release.apk
            research360-android/buildsrc/APK-SHA256-v1.0.0.txt
            research360-android/buildsrc/INSTALL-S24-ULTRA-LADB.txt
            research360-android/buildsrc/app/build/reports/lint-results-release.html
