name: Build Multyfi Profit Engine Direct APK

on:
  push:
    branches:
      - mpe-apk-final-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        shell: bash
        run: |
          set -euo pipefail
          cat build-assets/mpe-final-source.b64.* | tr -d '\n\r ' | base64 --decode > mpe-final-source.zip
          unzip -t mpe-final-source.zip
          unzip -q mpe-final-source.zip
          test -f mpe_final_project/settings.gradle.kts

      - name: Compile, lint, and assemble release
        working-directory: mpe_final_project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean lintRelease assembleRelease --stacktrace

      - name: Generate update key and sign APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-output
          PASS="$(openssl rand -hex 24)"
          KEYSTORE="signed-output/Multyfi_Profit_Engine_Update_Key.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias multyfi_profit_engine \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Multyfi Profit Engine, OU=Private Android, O=Suhas Srinivasa, L=Bengaluru, ST=Karnataka, C=IN"

          UNSIGNED="mpe_final_project/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="signed-output/app-release-aligned.apk"
          FINAL="signed-output/Multyfi_Profit_Engine_1_0_0.apk"
          test -f "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias multyfi_profit_engine \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --out "$FINAL" \
            "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$FINAL" | tee signed-output/APK_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | tee signed-output/APK_BADGING.txt
          sha256sum "$FINAL" | tee signed-output/Multyfi_Profit_Engine_1_0_0.apk.sha256
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=multyfi_profit_engine\n' "$PASS" "$PASS" > signed-output/PRIVATE_UPDATE_KEY.txt
          rm -f "$ALIGNED"

      - name: Upload direct APK and update key
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-Profit-Engine-1.0.0-Direct-APK
          path: signed-output/
          if-no-files-found: error
          retention-days: 7
