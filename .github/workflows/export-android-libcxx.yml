name: Export Android Build Tools Runtime

on:
  pull_request:
    branches: [main]

jobs:
  export-runtime:
    if: contains(github.event.pull_request.title, '[BUILD-MULTYFI-V3]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Collect runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          find "$ANDROID_HOME/build-tools/35.0.0" -name 'libc++.so' -type f -print -exec cp {} runtime/ \;
          test -s runtime/libc++.so
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-libcxx
          path: runtime/libc++.so
          if-no-files-found: error
          retention-days: 1
