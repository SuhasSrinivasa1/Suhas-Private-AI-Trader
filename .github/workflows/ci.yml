name: Validate Private AI Trader

on:
  workflow_dispatch:
  push:
    branches: [main, feature/mac-local-llm]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-linux:
    name: Linux validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Python syntax
        run: python -m compileall -q backend scripts

      - name: Trading rules contract
        run: python scripts/check_rules_contract.py

      - name: Secret leakage scan
        run: python scripts/check_no_secrets.py

      - name: Frontend JavaScript syntax
        run: |
          node --check app.js
          node --check features.js

      - name: Shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          bash -n run-mac.command
          bash -n setup_mac_local_ai.sh

      - name: Python tests
        working-directory: backend
        run: python -m pytest -q

      - name: Dependency consistency
        run: python -m pip check

  test-macos:
    name: macOS compatibility
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Python syntax
        run: python -m compileall -q backend scripts

      - name: Trading rules contract
        run: python scripts/check_rules_contract.py

      - name: Secret leakage scan
        run: python scripts/check_no_secrets.py

      - name: Safari-targeted JavaScript syntax
        run: |
          node --check app.js
          node --check features.js

      - name: Mac shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          bash -n run-mac.command
          bash -n setup_mac_local_ai.sh

      - name: Mac shell lint
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            shellcheck "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          shellcheck run-mac.command
          shellcheck setup_mac_local_ai.sh

      - name: Python tests on macOS
        working-directory: backend
        run: python -m pytest -q

      - name: Dependency consistency on macOS
        run: python -m pip check

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r backend/requirements.txt
