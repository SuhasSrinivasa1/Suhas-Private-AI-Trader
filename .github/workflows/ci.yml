name: Validate Private AI Trader

on:
  workflow_dispatch:
  push:
    branches: [main, feature/mac-local-llm]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-linux:
    name: Linux validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Python syntax
        run: python -m compileall -q backend scripts

      - name: Trading rules contract
        run: python scripts/check_rules_contract.py

      - name: Secret leakage scan
        run: python scripts/check_no_secrets.py

      - name: Frontend JavaScript syntax
        run: |
          node --check app.js
          node --check features.js
          node --check production.js

      - name: Shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          for command_file in *.command; do
            bash -n "$command_file"
          done

      - name: Python tests
        working-directory: backend
        run: python -m pytest -q

      - name: Dependency consistency
        run: python -m pip check

  test-macos:
    name: macOS compatibility
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Python syntax
        run: python -m compileall -q backend scripts

      - name: Trading rules contract
        run: python scripts/check_rules_contract.py

      - name: Secret leakage scan
        run: python scripts/check_no_secrets.py

      - name: Safari-targeted JavaScript syntax
        run: |
          node --check app.js
          node --check features.js
          node --check production.js

      - name: Mac shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          for command_file in *.command; do
            bash -n "$command_file"
          done

      - name: Mac shell lint
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            shellcheck "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          for command_file in *.command; do
            shellcheck "$command_file"
          done

      - name: Python tests on macOS
        working-directory: backend
        run: python -m pytest -q

      - name: Dependency consistency on macOS
        run: python -m pip check

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit

      - name: Generate dependency audit report
        id: audit
        shell: bash
        run: |
          set +e
          pip-audit -r backend/requirements.txt --format json --output pip-audit.json
          audit_exit=$?
          echo "exit_code=$audit_exit" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('pip-audit.json')
          if not path.exists():
              path.write_text(json.dumps({"error": "pip-audit did not create a report"}, indent=2) + "\n")
          PY
          exit 0

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: pip-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce clean runtime dependency audit
        shell: bash
        run: |
          if [[ "${{ steps.audit.outputs.exit_code }}" != "0" ]]; then
            echo "Runtime dependency vulnerability audit failed. Inspect dependency-audit-report."
            exit 1
          fi

  package-mac-production-release:
    name: Package Mac production release
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos, dependency-audit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean source ZIP
        run: |
          git archive --format=zip --prefix=Suhas-Private-AI-Trader/ HEAD -o Suhas-Private-AI-Trader-Mac-Production.zip
          sha256sum Suhas-Private-AI-Trader-Mac-Production.zip > Suhas-Private-AI-Trader-Mac-Production.zip.sha256

      - name: Upload production release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mac-production-release
          path: |
            Suhas-Private-AI-Trader-Mac-Production.zip
            Suhas-Private-AI-Trader-Mac-Production.zip.sha256
          if-no-files-found: error
          retention-days: 30
