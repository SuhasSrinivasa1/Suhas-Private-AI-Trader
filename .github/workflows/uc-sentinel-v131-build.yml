name: UC Sentinel v1.3.1 Android Build

on:
  push:
    paths:
      - 'android-stable/uc-sentinel-v131-build/**'
      - '.github/workflows/uc-sentinel-v131-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v1.3.0 and apply v1.3.1 hands-free automation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          wf = Path('.github/workflows/uc-sentinel-v130-build.yml').read_text()
          marker = "      - name: Reconstruct v1.2.1 and apply v1.3 reliability release\n        shell: bash\n        run: |\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("\n      - uses: actions/setup-java@v4", start)
          script = textwrap.dedent(wf[start:end])
          Path('/tmp/reconstruct-v130.sh').write_text('#!/usr/bin/env bash\nset -euo pipefail\n' + script + '\n')
          PY
          chmod +x /tmp/reconstruct-v130.sh
          /tmp/reconstruct-v130.sh

          SRC=/tmp/uc-sentinel/UC-Sentinel-v1.1.0-full-source
          test -f "$SRC/app/build.gradle.kts"
          grep -q 'versionCode = 130' "$SRC/app/build.gradle.kts"
          grep -q 'versionName = "1.3.0"' "$SRC/app/build.gradle.kts"

          tr -d '\r\n ' < android-stable/uc-sentinel-v131-build/v130-to-v131.patch.gz.b64 | base64 -d | gzip -dc > /tmp/v130-to-v131.patch
          cd "$SRC"
          patch -p1 --forward --batch < /tmp/v130-to-v131.patch || true

          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/uc-sentinel/UC-Sentinel-v1.1.0-full-source')
          prefs = root / 'app/src/main/java/com/suhas/ucsentinel/data/local/AppPreferences.kt'
          s = prefs.read_text()
          s = s.replace('):Map<String,Double>=', '):Map<String,Double> =')
          s = s.replace('():List<StrategyMetric>=', '():List<StrategyMetric> =')
          s = s.replace('):List<Candidate>=buildList', '):List<Candidate> = buildList')
          anchor = '    fun setLastPressureScanAt(v:Long){prefs.edit().putLong("last_pressure_scan_at",v).apply()}\n'
          extra = ('    fun lastNearCloseAutoScanAt():Long=prefs.getLong("last_near_close_auto_scan_at",0L)\n'
                   '    fun setLastNearCloseAutoScanAt(v:Long){prefs.edit().putLong("last_near_close_auto_scan_at",v).apply()}\n'
                   '    fun lastLearningAt():Long=prefs.getLong("last_learning_at",0L)\n'
                   '    fun setLastLearningAt(v:Long){prefs.edit().putLong("last_learning_at",v).apply()}\n')
          if 'fun lastNearCloseAutoScanAt()' not in s:
              s = s.replace(anchor, anchor + extra)
          prefs.write_text(s)
          repo = root / 'app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt'
          s = repo.read_text()
          s = s.replace('):List<Candidate>=freezeRecordToday', '):List<Candidate> = freezeRecordToday')
          old = '    suspend fun runLearningCycle():Map<ScannerSection,SectionAccuracy>{val token=accessToken();if(token.isNotBlank()&&prefs.loadSettings().learningEnabled)evaluateDueOutcomes(token);prefs.pruneMemory(prefs.loadSettings().memoryRetentionDays);return accuracies()}\n'
          new = ('    suspend fun runLearningCycle():Map<ScannerSection,SectionAccuracy>{\n'
                 '        val settings=prefs.loadSettings()\n'
                 '        if(settings.learningEnabled && ensureAutomationAuthentication()){\n'
                 '            evaluateDueOutcomes(accessToken())\n'
                 '            prefs.setLastLearningAt(System.currentTimeMillis())\n'
                 '        }\n'
                 '        prefs.pruneMemory(settings.memoryRetentionDays)\n'
                 '        return accuracies()\n'
                 '    }\n')
          if old in s:
              s = s.replace(old, new)
          repo.write_text(s)
          PY

          rm -f app/src/main/java/com/suhas/ucsentinel/data/local/AppPreferences.kt.rej app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt.rej
          grep -q 'versionCode = 131' app/build.gradle.kts
          grep -q 'versionName = "1.3.1"' app/build.gradle.kts
          grep -q 'bootstrapAfterAuthentication' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'ensureAutomationAuthentication' app/src/main/java/com/suhas/ucsentinel/worker/ScanWorker.kt
          grep -q 'lastNearCloseAutoScanAt' app/src/main/java/com/suhas/ucsentinel/data/local/AppPreferences.kt
          grep -q 'setLastLearningAt' app/src/main/java/com/suhas/ucsentinel/data/local/AppPreferences.kt
          grep -q 'Automation armed' app/src/main/java/com/suhas/ucsentinel/ui/MoreScreen.kt
          echo 'UC Sentinel v1.3.1 source reconstructed successfully'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and debug APK
        working-directory: /tmp/uc-sentinel/UC-Sentinel-v1.1.0-full-source
        run: gradle --no-daemon --console=plain clean testDebugUnitTest assembleDebug

      - name: Verify installable APK
        working-directory: /tmp/uc-sentinel/UC-Sentinel-v1.1.0-full-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=out/UC-Sentinel-S24-v1.3.1.apk
          test -s "$APK"
          cp "$APK" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.ucsentinel'" out/APK-BADGING.txt
          grep -q "versionCode='131'" out/APK-BADGING.txt
          grep -q "versionName='1.3.1'" out/APK-BADGING.txt
          sha256sum "$OUT" | tee out/SHA256.txt
          cd ..
          zip -qr UC-Sentinel-v1.3.1-full-source.zip UC-Sentinel-v1.1.0-full-source -x 'UC-Sentinel-v1.1.0-full-source/.gradle/*' 'UC-Sentinel-v1.1.0-full-source/app/build/*' 'UC-Sentinel-v1.1.0-full-source/build/*' 'UC-Sentinel-v1.1.0-full-source/out/*'
          mv UC-Sentinel-v1.3.1-full-source.zip UC-Sentinel-v1.1.0-full-source/out/

      - name: Upload APK and source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UC-Sentinel-S24-v1.3.1
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/uc-sentinel/UC-Sentinel-v1.1.0-full-source/out/UC-Sentinel-S24-v1.3.1.apk
            /tmp/uc-sentinel/UC-Sentinel-v1.1.0-full-source/out/UC-Sentinel-v1.3.1-full-source.zip
            /tmp/uc-sentinel/UC-Sentinel-v1.1.0-full-source/out/APK-SIGNATURE-VERIFY.txt
            /tmp/uc-sentinel/UC-Sentinel-v1.1.0-full-source/out/APK-BADGING.txt
            /tmp/uc-sentinel/UC-Sentinel-v1.1.0-full-source/out/SHA256.txt
