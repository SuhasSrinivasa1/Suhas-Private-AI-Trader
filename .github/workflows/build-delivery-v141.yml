name: Build Delivery Trade Hub v1.4.1

on:
  push:
    branches: [ delivery-v141-duration-20260910 ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v1.4.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            fresh-delivery-source-v130/part00.b64 \
            fresh-delivery-source-v130/part01.b64 \
            fresh-delivery-source-v130/part02.b64 \
            fresh-delivery-source-v130/part03.b64 \
            fresh-delivery-source-v130/part04.b64 \
            fresh-delivery-source-v130/tail08a.b64 \
            fresh-delivery-source-v130/part05a2.b64 \
            fresh-delivery-source-v130/part05b.b64 \
            fresh-delivery-source-v130/part06a.b64 \
            fresh-delivery-source-v130/part06b.b64 \
            fresh-delivery-source-v130/part07.b64 \
            | tr -d '\r\n' | base64 -d > /tmp/v130.zip
          unzip -t /tmp/v130.zip
          mkdir -p fresh-delivery-buy
          unzip -q /tmp/v130.zip -d fresh-delivery-buy
          cd fresh-delivery-buy
          python3 ../patch-v140/apply_v140.py
          python3 ../patch-v140/fix_java_strings.py
          python3 ../patch-v141/apply_v141.py
          python3 scripts/validate_contract.py
          grep -q "versionName '1.4.1'" app/build.gradle
          grep -q 'Duration from 1 to 3 Months' app/src/main/java/com/suhas/multyfideliverybuy/MainActivity.java
          grep -q 'DURATION_MONTHS' app/src/main/java/com/suhas/multyfideliverybuy/UnivestParser.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate v1.4.1 contract
        working-directory: fresh-delivery-buy
        run: python3 scripts/validate_contract.py

      - name: Unit tests
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:testReleaseUnitTest

      - name: Download v1.4.0 signing backup
        uses: actions/download-artifact@v4
        with:
          name: delivery-trade-hub-v140
          path: previous-v140
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SuhasSrinivasa1/Suhas-Private-AI-Trader
          run-id: 34378393138

      - name: Restore same signing identity
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-v140/Delivery-Trade-Hub-v1.4.0-SIGNING-BACKUP.zip -d /tmp/v140-signing
          PASS="$(sed -n 's/^Store password: //p' /tmp/v140-signing/SIGNING-BACKUP.txt | head -n1)"
          test -n "$PASS"
          echo "::add-mask::$PASS"
          cp /tmp/v140-signing/delivery-trade-hub-release.p12 fresh-delivery-buy/delivery-trade-hub-release.p12
          cp /tmp/v140-signing/SIGNING-BACKUP.txt fresh-delivery-buy/SIGNING-BACKUP.txt
          echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/fresh-delivery-buy/delivery-trade-hub-release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=deliverybuy" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify same signer and package
        working-directory: fresh-delivery-buy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/Delivery-Trade-Hub-v1.4.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/Delivery-Trade-Hub-v1.4.1.apk | tee output/APK-SIGNATURE-VERIFY.txt
          sha256sum output/Delivery-Trade-Hub-v1.4.1.apk | tee output/APK-SHA256.txt
          OLD_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' ../previous-v140/APK-SIGNATURE-VERIFY.txt | sed 's/.*digest: //')"
          NEW_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' output/APK-SIGNATURE-VERIFY.txt | sed 's/.*digest: //')"
          test -n "$OLD_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          echo "SAME SIGNER PASS: $NEW_CERT" | tee output/SIGNER-COMPATIBILITY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/Delivery-Trade-Hub-v1.4.1.apk | head -n 3 | tee output/APK-PACKAGE.txt
          grep -q "name='com.suhas.multyfideliverybuy'" output/APK-PACKAGE.txt
          grep -q "versionCode='141'" output/APK-PACKAGE.txt
          grep -q "versionName='1.4.1'" output/APK-PACKAGE.txt
          python3 scripts/validate_contract.py | tee output/CONTRACT-VALIDATION.txt

      - name: Package release
        working-directory: fresh-delivery-buy
        shell: bash
        run: |
          set -euo pipefail
          cp ../previous-v140/Delivery-Trade-Hub-v1.4.0-SIGNING-BACKUP.zip output/Delivery-Trade-Hub-SIGNING-BACKUP.zip
          cp README.md output/README-v1.4.1.md
          zip -qr output/delivery-trade-hub-source-v1.4.1.zip . \
            -x '.gradle/*' 'app/build/*' 'output/*' 'delivery-trade-hub-release.p12' 'SIGNING-BACKUP.txt'
          {
            echo "Delivery Trade Hub v1.4.1"
            echo "Install directly over v1.4.0; same package and same signing certificate are preserved."
            echo "Univest new equity entries are accepted only when notification Duration is 1 to 3 Months inclusive."
            echo "Examples accepted: 1 Month, 2 Months, 3 Months, 1-2 Months, 1-3 Months."
            echo "Entries above 3 months, below 1 month, non-month durations, or missing a supported duration are ignored."
            echo "Univest Profit Booked / Close / Exit for tracked holdings remains actionable regardless of duration text."
            echo "Univest remains CASH/CNC DELIVERY only and never MIS."
            echo "All Multyfi and manual trade behavior from v1.4.0 remains unchanged."
          } > output/INSTALL-v1.4.1.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: delivery-trade-hub-v141
          path: fresh-delivery-buy/output/*
          if-no-files-found: error
          retention-days: 30
