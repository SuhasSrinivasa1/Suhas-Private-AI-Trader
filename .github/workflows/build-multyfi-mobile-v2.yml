name: Build Multyfi Intraday Mobile V2

on:
  push:
    branches:
      - chatgpt-multyfi-mobile-v2-build
    paths:
      - '.github/workflows/build-multyfi-mobile-v2.yml'
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct V1 base
        shell: bash
        run: |
          set -euo pipefail
          cd chatgpt-build/multyfi-mobile-v1
          cat source.part02c0 source.part02c1 source.part02c2 source.part02c3 > source.part02c.fixed
          cat source.part02a source.part02b source.part02c.fixed source.part02d > source.part02.fixed
          cat source.part00 source.part01 source.part02.fixed source.part03 source.part04 source.part05 source.part06 | base64 --decode > source.zip
          echo '30ea3109978c06b3082b922a3416d8d71e77dc5995b97334648260dc49dbbed0  source.zip' | sha256sum -c -
          unzip -q source.zip -d work

      - name: Apply V1.1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/chatgpt-build/multyfi-mobile-v1"
          APP="$ROOT/work/android-app"
          cp "$ROOT/overrides/MultyfiParser.kt" "$APP/app/src/main/java/com/intradayone/mobile/notification/MultyfiParser.kt"
          cp "$ROOT/overrides/SignalEngine.kt" "$APP/app/src/main/java/com/intradayone/mobile/core/SignalEngine.kt"
          sed -i 's/versionCode = 100/versionCode = 110/' "$APP/app/build.gradle.kts"
          sed -i 's/versionName = "1.0.0"/versionName = "1.1.0"/' "$APP/app/build.gradle.kts"

      - name: Apply V1.2
        shell: bash
        run: |
          set -euo pipefail
          V12="$GITHUB_WORKSPACE/chatgpt-build/multyfi-mobile-v1.2"
          APP="$GITHUB_WORKSPACE/chatgpt-build/multyfi-mobile-v1/work/android-app"
          cat "$V12/patch.part00" "$V12/patch.part01" "$V12/patch.part02" > "$V12/v12.patch.gz.b64"
          base64 --decode "$V12/v12.patch.gz.b64" | gzip -d > "$V12/v12.patch"
          cd "$APP"
          set +e
          patch -p1 < "$V12/v12.patch"
          set -e
          cp "$V12/SignalEngine.kt" app/src/main/java/com/intradayone/mobile/core/SignalEngine.kt
          cp "$V12/MultyfiParser.kt" app/src/main/java/com/intradayone/mobile/notification/MultyfiParser.kt
          find app -name '*.rej' -delete
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/intradayone/mobile/data/SessionRepository.kt')
          s = p.read_text()
          marker = 'val direction = if (submitted.transactionType == "BUY") 1.0 else -1.0'
          if 'confirmedBroker = broker ?: return@let' not in s:
              s = s.replace(marker, 'val confirmedBroker = broker ?: return@let\n                    ' + marker, 1)
              s = s.replace('broker.netPrice', 'confirmedBroker.netPrice')
          p.write_text(s)
          PY

      - name: Apply V1.2.1 and convert to new V2 app
        shell: bash
        run: |
          set -euo pipefail
          V121="$GITHUB_WORKSPACE/chatgpt-build/multyfi-mobile-v1.2.1-final"
          APP="$GITHUB_WORKSPACE/chatgpt-build/multyfi-mobile-v1/work/android-app"
          cat "$V121/patch.part00" "$V121/patch.part01" "$V121/patch.part02" > "$V121/v121.patch.gz.b64"
          base64 --decode "$V121/v121.patch.gz.b64" | gzip -d > "$V121/v121.patch"
          cd "$APP"
          set +e
          patch -p2 < "$V121/v121.patch"
          set -e
          find app -name '*.rej' -delete
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('applicationId = "com.intradayone.mobile"','applicationId = "com.multyfi.intraday.mobile"')
          s=s.replace('versionCode = 121','versionCode = 200')
          s=s.replace('versionName = "1.2.1"','versionName = "2.0.0"')
          p.write_text(s)
          p=Path('app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('android:label="Multyfi Intraday V1.2.1"','android:label="Multyfi Intraday Mobile V2"')
          p.write_text(s)
          PY
          grep -q 'applicationId = "com.multyfi.intraday.mobile"' app/build.gradle.kts
          grep -q 'versionName = "2.0.0"' app/build.gradle.kts
          grep -q 'growwStatus' app/src/main/java/com/intradayone/mobile/data/SessionRepository.kt
          grep -q 'userProfile' app/src/main/java/com/intradayone/mobile/network/GrowwClient.kt
          grep -q 'startForegroundService' app/src/main/java/com/intradayone/mobile/notification/MultyfiNotificationListener.kt

      - name: Build unsigned V2 release APK
        shell: bash
        run: |
          set -euo pipefail
          cd chatgpt-build/multyfi-mobile-v1/work/android-app
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Generate new V2 signing identity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/chatgpt-build/multyfi-mobile-v1"
          mkdir -p "$ROOT/signing-v2" "$ROOT/out"
          PASS="$(openssl rand -hex 24)"
          printf '%s' "$PASS" > "$ROOT/signing-v2/SIGNING_PASSWORD.txt"
          keytool -genkeypair -v -storetype PKCS12 -keystore "$ROOT/signing-v2/multyfi-v2-signing.p12" -storepass "$PASS" -keypass "$PASS" -alias multyfi-intraday-v2 -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=Multyfi Intraday Mobile V2, OU=Mobile, O=Independent, L=Bengaluru, ST=Karnataka, C=IN'

      - name: Sign and verify V2 APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/chatgpt-build/multyfi-mobile-v1"
          APP="$ROOT/work/android-app/app"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          PASS="$(cat "$ROOT/signing-v2/SIGNING_PASSWORD.txt")"
          "$BT/zipalign" -p -f 4 "$APP/build/outputs/apk/release/app-release-unsigned.apk" "$ROOT/out/Multyfi_Intraday_Mobile_V2-aligned.apk"
          "$BT/apksigner" sign --ks "$ROOT/signing-v2/multyfi-v2-signing.p12" --ks-type PKCS12 --ks-key-alias multyfi-intraday-v2 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$ROOT/out/Multyfi_Intraday_Mobile_V2.apk" "$ROOT/out/Multyfi_Intraday_Mobile_V2-aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$ROOT/out/Multyfi_Intraday_Mobile_V2.apk" | tee "$ROOT/out/SIGNATURE.txt"
          sha256sum "$ROOT/out/Multyfi_Intraday_Mobile_V2.apk" | tee "$ROOT/out/APK_SHA256.txt"
          rm -f "$ROOT/out/Multyfi_Intraday_Mobile_V2-aligned.apk"

      - name: Upload signed V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-Intraday-Mobile-V2-signed
          path: |
            chatgpt-build/multyfi-mobile-v1/out/Multyfi_Intraday_Mobile_V2.apk
            chatgpt-build/multyfi-mobile-v1/out/APK_SHA256.txt
            chatgpt-build/multyfi-mobile-v1/out/SIGNATURE.txt
            chatgpt-build/multyfi-mobile-v1/signing-v2/multyfi-v2-signing.p12
            chatgpt-build/multyfi-mobile-v1/signing-v2/SIGNING_PASSWORD.txt
          if-no-files-found: error
          retention-days: 7
