name: Univest v2.2.0 Ephemeral Signed Release
on:
  push:
    branches: [main]
    paths-ignore:
      - '.release/**'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build sign validate and publish
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch univest-v220-build https://github.com/SuhasSrinivasa1/AI-Trader.git source_repo
          SRC="$GITHUB_WORKSPACE/source_repo/.build-temp/univest-v220-work/source"
          OUT="$GITHUB_WORKSPACE/.release/univest-v220-final"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          grep -q "versionCode 220" "$SRC/app/build.gradle"
          grep -q "versionName '2.2.0'" "$SRC/app/build.gradle"
          ! grep -R -q 'ANDROID_NOTIFICATION_DUPLICATE_SUPPRESSED' "$SRC/app/src/main/java"
          cd "$SRC"
          gradle --no-daemon --console=plain clean testReleaseUnitTest assembleRelease | tee "$OUT/test-results.txt"
          PASS="$(openssl rand -hex 24)"
          KS="$RUNNER_TEMP/univest-v220.jks"
          keytool -genkeypair -v -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias univest-v220 -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=Univest AutoTrade v2.2.0, OU=Private Release, O=Univest AutoTrade, L=Bengaluru, ST=Karnataka, C=IN'
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --ks-key-alias univest-v220 --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$OUT/Univest-AutoTrade-v2.2.0-SIGNED.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/Univest-AutoTrade-v2.2.0-SIGNED.apk" | tee "$OUT/APK-SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT/Univest-AutoTrade-v2.2.0-SIGNED.apk" | tee "$OUT/APK-BADGING.txt"
          grep -q "package: name='com.suhas.multyfideliverybuy'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='220'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='2.2.0'" "$OUT/APK-BADGING.txt"
          sha256sum "$OUT/Univest-AutoTrade-v2.2.0-SIGNED.apk" | tee "$OUT/APK-SHA256.txt"
          (cd "$SRC" && zip -qr "$OUT/Univest-AutoTrade-v2.2.0-source.zip" . -x '*/build/*' '.gradle/*' '*.jks' '*.keystore')
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$OUT/APK-SIGNATURE.txt" | head -1)"
          {
            echo "Univest AutoTrade v2.2.0 build: SUCCESS"
            echo "package=com.suhas.multyfideliverybuy"
            echo "versionCode=220"
            echo "versionName=2.2.0"
            echo "sourcePackage=com.univest.capp"
            echo "product=NSE CASH / CNC DELIVERY ONLY"
            echo "notificationDuplicateExecutionGate=removed"
            echo "backInRangeBrokerFlat=INR 20000 missed initial entry"
            echo "backInRangeHoldingExists=INR 5000 add"
            echo "averaging=INR 5000 at -2/-4/-6 percent, max 3"
            echo "signingCertificateSHA256=$CERT"
            echo "signingIdentity=ephemeral new identity"
          } > "$OUT/Univest-AutoTrade-v2.2.0-build-report.txt"
          echo SUCCESS > "$OUT/ci-status.txt"
          rm -f "$KS"
          cd "$GITHUB_WORKSPACE"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f .release/univest-v220-final
          git commit -m "Publish Univest AutoTrade v2.2.0 signed release"
          git push origin HEAD:main
