name: Univest v2.2.0 Ephemeral Signed Release (archived)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Archived workflow notice
        run: |
          echo "The automatic ephemeral v2.2.0 release workflow is archived."
          echo "It no longer rebuilds Univest on unrelated pushes to main."
