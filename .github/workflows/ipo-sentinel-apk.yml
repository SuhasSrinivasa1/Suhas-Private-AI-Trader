name: Build IPO Sentinel APK

on:
  push:
    branches:
      - feature/ipo-listing-engine-bootstrap
    paths:
      - "ipo-listing-engine/android/**"
      - ".github/workflows/ipo-sentinel-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IPO_SENTINEL_API_URL: ${{ secrets.IPO_SENTINEL_API_URL }}
      IPO_SENTINEL_DEVICE_KEY: ${{ secrets.IPO_SENTINEL_DEVICE_KEY }}
    defaults:
      run:
        working-directory: ipo-listing-engine/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/IPO-Sentinel-v0.5.0-debug.apk
          sha256sum release/IPO-Sentinel-v0.5.0-debug.apk > release/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPO-Sentinel-v0.5.0-apk
          path: ipo-listing-engine/android/release/*
          if-no-files-found: error
          retention-days: 30

