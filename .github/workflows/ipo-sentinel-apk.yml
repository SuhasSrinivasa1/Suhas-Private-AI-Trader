name: Build IPO Sentinel Stable

on:
  push:
    branches:
      - feature/ipo-listing-engine-bootstrap
    paths:
      - "ipo-listing-engine/**"
      - ".github/workflows/ipo-sentinel-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ipo-listing-engine/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend + tests
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee validation.log
          python -m pip install -e ".[dev]" 2>&1 | tee -a validation.log

      - name: Compile backend
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q app scripts tests 2>&1 | tee -a validation.log

      - name: Run backend tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee -a validation.log

      - name: Dependency check
        id: deps
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip check 2>&1 | tee -a validation.log

      - name: Upload backend validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-sentinel-backend-validation
          path: ipo-listing-engine/backend/validation.log
          if-no-files-found: error

      - name: Enforce backend validation gate
        if: always()
        shell: bash
        run: |
          echo "install=${{ steps.install.outcome }}"
          echo "compile=${{ steps.compile.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          echo "deps=${{ steps.deps.outcome }}"
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.compile.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.deps.outcome }}" = "success"

  build-apk:
    needs: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IPO_SENTINEL_API_URL: ${{ secrets.IPO_SENTINEL_API_URL }}
      IPO_SENTINEL_DEVICE_KEY: ${{ secrets.IPO_SENTINEL_DEVICE_KEY }}
    defaults:
      run:
        working-directory: ipo-listing-engine/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build stable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/IPO-Sentinel-v1.0.0-debug.apk
          sha256sum release/IPO-Sentinel-v1.0.0-debug.apk > release/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPO-Sentinel-v1.0.0-stable
          path: ipo-listing-engine/android/release/*
          if-no-files-found: error
          retention-days: 30
