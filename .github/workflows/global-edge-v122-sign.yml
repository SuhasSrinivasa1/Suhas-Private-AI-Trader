name: Global Edge v1.2.2 Stable Signed Build

on:
  push:
    paths:
      - '.github/workflows/global-edge-v122-sign.yml'
      - '.private-signing/global-edge/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct, patch, test, build and stable-sign v1.2.2
        id: build
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            rm -rf /tmp/ai-trader /tmp/global-edge-v103
            git clone --depth 1 https://github.com/SuhasSrinivasa1/AI-Trader.git /tmp/ai-trader
            PUB=/tmp/ai-trader
            cp "$PUB/fresh-global-edge/v103/reconstruct_v103.sh" /tmp/reconstruct_v103.sh
            sed -i '/^grep -q /d' /tmp/reconstruct_v103.sh
            bash /tmp/reconstruct_v103.sh
            SRC=/tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source

            python "$PUB/fresh-global-edge/v103/upgrade_v103_entry_ui.py" "$SRC"
            python "$PUB/fresh-global-edge/v104/upgrade_v104.py" "$SRC"
            python "$PUB/fresh-global-edge/v104/fix_v104_notification.py" "$SRC"

            apply_patch_file() {
              dir="$1"; file="$2"
              cat "$PUB/fresh-global-edge/$dir/$file" | tr -d '\r\n ' | base64 -d > /tmp/p.gz
              gunzip -c /tmp/p.gz > /tmp/p.patch
              cd "$SRC"
              patch -p1 --batch < /tmp/p.patch
            }

            apply_patch_file v110 v104-to-v110.patch.gz.b64
            apply_patch_file v111 v110-to-v111.patch.gz.b64
            python "$PUB/fresh-global-edge/v111/fix_v111_experimental.py" "$SRC"
            apply_patch_file v112 v111-to-v112.patch.gz.b64
            apply_patch_file v113 v112-to-v113.patch.gz.b64
            apply_patch_file v114 v113-to-v114.patch.gz.b64
            python "$PUB/fresh-global-edge/v115/upgrade_v115.py" "$SRC"
            apply_patch_file v116 v115-to-v116.patch.gz.b64
            apply_patch_file v117 v116-to-v117.patch.gz.b64
            apply_patch_file v118 v117-to-v118.patch.gz.b64
            apply_patch_file v119 v118-to-v119.patch.gz.b64
            apply_patch_file v120 v119-to-v120.patch.gz.b64

            cd "$SRC"
            cat \
              "$PUB/fresh-global-edge/v121/patch.part00" \
              "$PUB/fresh-global-edge/v121/patch.part01" \
              "$PUB/fresh-global-edge/v121/patch.part02" \
              "$PUB/fresh-global-edge/v121/patch.part03" \
              "$PUB/fresh-global-edge/v121/patch.part04" \
              "$PUB/fresh-global-edge/v121/patch.part05" \
              | tr -d '\r\n ' | base64 -d > /tmp/v120-to-v121.patch.gz
            gunzip -c /tmp/v120-to-v121.patch.gz > /tmp/v120-to-v121.patch
            patch -p1 --batch < /tmp/v120-to-v121.patch

            python "$PUB/fresh-global-edge/v122/fix_v122.py" "$SRC"

            grep -q 'versionCode = 122' app/build.gradle.kts
            grep -q 'versionName = "1.2.2"' app/build.gradle.kts
            grep -q 'parsed?.takeIf{it.isFinite()}' app/src/main/java/com/suhas/ucsentinel/data/remote/GrowwClient.kt
            grep -q 'Prediction horizon expired' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
            grep -q 'lastForegroundGovernanceAt' app/src/main/java/com/suhas/ucsentinel/ui/MainViewModel.kt

            gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease

            mkdir -p out
            UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n 1)
            test -n "$UNSIGNED" && test -s "$UNSIGNED"

            KEYSTORE=/tmp/global-edge-release.keystore
            base64 -d "$GITHUB_WORKSPACE/.private-signing/global-edge/global-edge-release.keystore.b64" > "$KEYSTORE"
            PASS=$(cat "$GITHUB_WORKSPACE/.private-signing/global-edge/global-edge-release.password")
            OUT=out/Global-Edge-AI-Trader-v1.2.2.apk

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$KEYSTORE" --ks-pass pass:"$PASS" --key-pass pass:"$PASS" \
              --ks-key-alias globaledge --out "$OUT" "$UNSIGNED"

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
            grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
            grep -q "versionCode='122'" out/APK-BADGING.txt
            grep -q "versionName='1.2.2'" out/APK-BADGING.txt
            sha256sum "$OUT" | tee out/SHA256.txt
          } 2>&1 | tee /tmp/global-edge-v122-build.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/global-edge-v122-build.rc
          exit "$rc"

      - name: Upload stable signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.2.2-STABLE-SIGNED
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/Global-Edge-AI-Trader-v1.2.2.apk
            /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/APK-SIGNATURE-VERIFY.txt
            /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/APK-BADGING.txt
            /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/SHA256.txt

      - name: Publish latest run status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DIR=.private-signing/global-edge/status
          mkdir -p "$DIR"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "job_status=${{ job.status }}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$DIR/latest-run.txt"
          tail -n 300 /tmp/global-edge-v122-build.log > "$DIR/latest-build.log" 2>/dev/null || true
          if [ -f /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/SHA256.txt ]; then
            cp /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/SHA256.txt "$DIR/latest-sha256.txt"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DIR"
          git commit -m 'Record Global Edge v1.2.2 signed build status [skip ci]' || true
          git push
