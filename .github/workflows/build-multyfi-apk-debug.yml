name: Build Dhruva Multyfi APK Debug

on:
  pull_request:
    branches: [main]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and retain diagnostics
        shell: bash
        run: |
          mkdir -p android-multyfi-bridge/ci-output
          set +e
          cd android-multyfi-bridge
          gradle --no-daemon :app:assembleDebug > ci-output/build-output.log 2>&1
          code=$?
          echo "$code" > ci-output/build-exit-code.txt
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ci-output/Dhruva-Multyfi-Bridge-v1.0.0.apk
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: Dhruva-Multyfi-Bridge-build-output
          path: android-multyfi-bridge/ci-output/
          if-no-files-found: error
