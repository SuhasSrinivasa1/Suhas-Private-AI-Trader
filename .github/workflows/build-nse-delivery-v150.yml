name: Build NSE Delivery Momentum v1.5.0

on:
  push:
    branches:
      - build/nse-delivery-v1.5.0-20260826
    paths:
      - 'nse-v150-xz.part.*'
      - '.github/workflows/build-nse-delivery-v150.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Restore v1.5.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat nse-v150-xz.part.00 nse-v150-xz.part.01 nse-v150-xz.part.02 nse-v150-xz.part.03 nse-v150-xz.part.04 | base64 -d > /tmp/nse-v150.tar.xz
          tar -xJf /tmp/nse-v150.tar.xz
          test -f nse-delivery-v150/app/build.gradle
          grep -q "versionName '1.5.0'" nse-delivery-v150/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        working-directory: nse-delivery-v150
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        working-directory: nse-delivery-v150
        run: gradle --no-daemon lintDebug

      - name: Assemble release APK
        working-directory: nse-delivery-v150
        run: gradle --no-daemon assembleRelease

      - name: Fresh-sign and verify APK
        working-directory: nse-delivery-v150
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="NSE-Delivery-Momentum-S24-v1.5.0-CONFIRMED-FALLING-KNIFE-FRESH-SIGNED.apk"
          OUT_UNSIGNED="NSE-Delivery-Momentum-S24-v1.5.0-CONFIRMED-FALLING-KNIFE-UNSIGNED.apk"
          test -s "$UNSIGNED"
          keytool -genkeypair -v \
            -keystore fresh-v150.jks \
            -storepass changeit \
            -keypass changeit \
            -alias nse-v150 \
            -keyalg RSA \
            -keysize 4096 \
            -validity 3650 \
            -dname "CN=NSE Delivery Momentum v1.5.0, OU=Fresh Build, O=NSE Delivery Momentum, L=Bengaluru, ST=Karnataka, C=IN"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign \
            --ks fresh-v150.jks \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out "$SIGNED" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee APK-SIGNATURE-VERIFY.txt
          cp "$UNSIGNED" "$OUT_UNSIGNED"
          sha256sum "$SIGNED" "$OUT_UNSIGNED" > SHA256.txt

      - name: Package clean source
        shell: bash
        run: |
          set -euo pipefail
          zip -qr NSE-Delivery-Momentum-v1.5.0-SOURCE.zip nse-delivery-v150 \
            -x 'nse-delivery-v150/app/build/*' \
               'nse-delivery-v150/.gradle/*' \
               'nse-delivery-v150/fresh-v150.jks'

      - name: Upload v1.5.0 package
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Delivery-Momentum-v1.5.0
          if-no-files-found: error
          retention-days: 30
          path: |
            nse-delivery-v150/NSE-Delivery-Momentum-S24-v1.5.0-CONFIRMED-FALLING-KNIFE-FRESH-SIGNED.apk
            nse-delivery-v150/NSE-Delivery-Momentum-S24-v1.5.0-CONFIRMED-FALLING-KNIFE-UNSIGNED.apk
            nse-delivery-v150/SHA256.txt
            nse-delivery-v150/APK-SIGNATURE-VERIFY.txt
            nse-delivery-v150/RELEASE-NOTES-v1.5.0.txt
            NSE-Delivery-Momentum-v1.5.0-SOURCE.zip
