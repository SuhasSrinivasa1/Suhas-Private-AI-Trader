name: Build Multyfi V3.0.5 Data Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-v305-data-quality:
    if: contains(github.event.pull_request.title, '[BUILD-MULTYFI-V3]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply permissive credential UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/MainActivity.kt')
          s = p.read_text()
          s = s.replace('        super.onCreate(savedInstanceState)\n', '        super.onCreate(savedInstanceState)\n        window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE)\n', 1)
          s = s.replace('        if (::content.isInitialized) renderSelected()\n', '        if (::content.isInitialized && selected != "SETTINGS") renderSelected()\n', 1)
          s = s.replace('        setTextColor(text)\n', '        setTextColor(this@MainActivity.text)\n', 1)
          s = s.replace('        singleLine = true\n', '        setSingleLine(true)\n', 1)
          s = s.replace(
              '        s.addView(statusRow("Groww API", if (groww) "LIVE" else if (repo.accessToken().isBlank()) "NOT CONFIGURED" else "VALIDATION REQUIRED", if (groww) true else false))\n',
              '''        s.addView(statusRow("Groww API", when {\n            groww -> "LIVE"\n            repo.accessToken().isNotBlank() -> "VALIDATION REQUIRED"\n            repo.growwCredentialsConfigured() -> "CONNECT REQUIRED"\n            else -> "NOT CONFIGURED"\n        }, if (groww) true else false))\n'''
          )
          start = s.index('        sectionTitle("Groww API",')
          end = s.index('        sectionTitle("Static IP",', start)
          new_settings = '''        sectionTitle(\n            "Groww API",\n            "Copy/paste is unrestricted. Switching to another app and back will not erase entered values. Screenshots are allowed, and credential fields are visible instead of masked."\n        )\n        val apiKey = editField("API Key / TOTP Token", password = false).apply {\n            setText(repo.apiKey())\n            isLongClickable = true\n        }\n        val apiSecret = editField("API Secret / TOTP Secret", password = false).apply {\n            setText(repo.apiSecret())\n            isLongClickable = true\n        }\n        addCard(apiKey, bottom = 8)\n        addCard(apiSecret, bottom = 10)\n\n        val authHint = cardBox(14, purpleSoft)\n        authHint.addView(t("API Key + API Secret", 14f, purple, true))\n        authHint.addView(t("Paste the API Key into the first field and API Secret into the second, then tap Connect • Key + Secret. Values remain visible and can be captured in screenshots.", 12f, text).apply { setPadding(0, dp(5), 0, 0) })\n        addCard(authHint, bottom = 10)\n\n        val growwButtons = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }\n        growwButtons.addView(secondaryButton("Connect • Key + Secret") { connectGrowwAsync(apiKey.text.toString(), apiSecret.text.toString(), "APPROVAL") }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))\n        growwButtons.addView(primaryButton("Connect • TOTP") { connectGrowwAsync(apiKey.text.toString(), apiSecret.text.toString(), "TOTP") }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { leftMargin = dp(8) })\n        content.addView(growwButtons)\n        content.addView(spacer(12))\n\n        val token = editField("Optional existing Access Token", password = false).apply {\n            setText(repo.accessToken())\n            isLongClickable = true\n        }\n        addCard(token, bottom = 8)\n        addCard(secondaryButton("Validate Existing Access Token") {\n            val entered = token.text.toString().trim()\n            if (entered.isNotBlank()) repo.saveAccessToken(entered)\n            validateGrowwAsync()\n        }, bottom = 20)\n\n'''
          s = s[:start] + new_settings + s[end:]
          s = s.replace(
              '''            if (token.text.toString().trim().isNotBlank()) repo.saveAccessToken(token.text.toString())\n            if (apiKey.text.toString().trim().isNotBlank()) repo.saveApiKey(apiKey.text.toString())\n            repo.saveWhitelistIp(ip.text.toString())\n''',
              '''            if (token.text.toString().trim().isNotBlank()) repo.saveAccessToken(token.text.toString())\n            if (apiKey.text.toString().trim().isNotBlank()) repo.saveApiKey(apiKey.text.toString())\n            if (apiSecret.text.toString().trim().isNotBlank()) repo.saveApiSecret(apiSecret.text.toString())\n            repo.saveWhitelistIp(ip.text.toString())\n'''
          )
          ms = s.index('    private fun generateTokenAsync(')
          me = s.index('    private fun detectIpAsync()', ms)
          connect = '''    private fun connectGrowwAsync(keyEntered: String, secretEntered: String, mode: String) {\n        if (keyEntered.isNotBlank()) repo.saveApiKey(keyEntered)\n        if (secretEntered.isNotBlank()) repo.saveApiSecret(secretEntered)\n        val key = repo.apiKey()\n        val secret = repo.apiSecret()\n        if (key.isBlank() || secret.isBlank()) { toast("Enter both Groww credential values first"); return }\n        val isTotp = mode.equals("TOTP", true)\n        worker.execute {\n            runCatching { if (isTotp) GrowwClient.generateAccessTokenWithTotp(key, secret) else GrowwClient.generateAccessTokenWithApproval(key, secret) }\n                .onSuccess { access ->\n                    repo.saveAccessToken(access)\n                    val ok = GrowwClient.validateAccessToken(access)\n                    if (ok) repo.markGrowwValidated() else repo.clearGrowwValidation()\n                    runOnUiThread { toast(if (ok) "Groww connected and validated" else "Token generated; validation failed"); showSettings() }\n                }\n                .onFailure { e -> repo.clearGrowwValidation(); runOnUiThread { toast(e.message ?: "Groww authentication failed") } }\n        }\n    }\n\n'''
          s = s[:ms] + connect + s[me:]
          p.write_text(s)
          PY

      - name: Apply V3.0.5 data-quality fixes
        shell: bash
        run: |
          set -euo pipefail
          SRC='Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile'

          cat > "$SRC/MultyfiNotificationSemantics.kt" <<'KOT'
          package com.multyfi.intraday.mobile

          import java.util.Locale

          object MultyfiNotificationSemantics {
              enum class Kind { INTRADAY_RELEASE, UPDATE, EXIT, PRE_ALERT, SWING, OTHER }

              fun classify(text: String): Kind {
                  val u = text.uppercase(Locale.US).replace('’', '\'')
                  if (u.contains("SWING TRADE") || u.contains("EQUITY SWING")) return Kind.SWING
                  if (u.contains("WILL BE POSTED") || u.contains("IN 15 MINS") || u.contains("IN 15 MIN") || u.contains("STAY ALERT")) return Kind.PRE_ALERT
                  if (u.contains("EARLY EXIT") || u.contains("EXIT RECEIVED") || u.contains("NO UNIVEST HOLDING") || u.contains("SECURING GAINS")) return Kind.EXIT
                  if (Regex("(^|\\W)EXIT($|\\W)").containsMatchIn(u)) return Kind.EXIT
                  if (Regex("(^|\\W)UPDATE($|\\W)").containsMatchIn(u)) return Kind.UPDATE

                  val intraday = u.contains("EQUITY INTRADAY") || u.contains("INTRADAY TRADE")
                  val released = u.contains("RELEASED") || u.contains("NEW TRADE") || u.contains("TRADE RELEASED")
                  val hasIdentity = u.contains("STOCK NAME") || u.contains("TRADING SYMBOL") || u.contains("NSE:") || u.contains("NSE -")
                  val hasPlan = u.contains("ENTRY RANGE") || u.contains("ENTRY PRICE") || u.contains("STOP LOSS") || u.contains("TARGET")
                  return if (intraday && released && hasIdentity && hasPlan) Kind.INTRADAY_RELEASE else Kind.OTHER
              }

              fun isAllowedSourcePackage(packageName: String, configuredPackage: String): Boolean {
                  val p = packageName.trim().lowercase(Locale.US)
                  if (p.isBlank()) return false
                  if (p.contains("univest") || p.contains("deliverybuy")) return false
                  val configured = configuredPackage.trim().lowercase(Locale.US)
                  return if (configured.isNotBlank()) p == configured else p == "com.multyfi.invest"
              }

              fun isCandidateCreationEvent(text: String): Boolean = classify(text) == Kind.INTRADAY_RELEASE
          }
          KOT

          cat > "$SRC/MultyfiNotificationService.kt" <<'KOT'
          package com.multyfi.intraday.mobile

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.ScheduledExecutorService
          import java.util.concurrent.TimeUnit

          class MultyfiNotificationService : NotificationListenerService() {
              private lateinit var repo: AppRepository
              private lateinit var catalog: GrowwInstrumentCatalog
              private lateinit var sanitizer: CandidateSanitizer
              private var executor: ScheduledExecutorService? = null
              private val errorTimestamps = mutableMapOf<String, Long>()
              @Volatile private var lastCatalogRefreshAttempt = 0L

              override fun onCreate() {
                  super.onCreate()
                  repo = AppRepository(this)
                  catalog = GrowwInstrumentCatalog(this)
                  sanitizer = CandidateSanitizer(this)
              }

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  repo.markListenerHeartbeat()
                  repo.logActivity("SYSTEM", "Multyfi access enabled", "Notification listener connected. Only genuine initial Multyfi Equity Intraday releases can create paper candidates.")
                  startLoop()
                  executor?.execute { refreshCatalogAndSanitize(force = false) }
              }

              override fun onListenerDisconnected() {
                  repo.logActivity("SYSTEM", "Multyfi listener disconnected", "Android disconnected the notification listener.", "WARN")
                  stopLoop()
                  super.onListenerDisconnected()
              }

              override fun onDestroy() {
                  stopLoop()
                  super.onDestroy()
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  val n = sbn ?: return
                  repo.markListenerHeartbeat()
                  val extras = n.notification.extras
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString().orEmpty()
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString().orEmpty()
                  val big = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString().orEmpty()
                  val combined = listOf(title, text, big).filter { it.isNotBlank() }.distinct().joinToString(" • ")
                  if (combined.isBlank()) return

                  if (!MultyfiNotificationSemantics.isAllowedSourcePackage(n.packageName, repo.sourcePackage())) return

                  val kind = MultyfiNotificationSemantics.classify(combined)
                  if (kind != MultyfiNotificationSemantics.Kind.INTRADAY_RELEASE) {
                      throttledLog(
                          "semantic_${kind.name}",
                          "Notification ignored • ${kind.name.replace('_', ' ')}",
                          "This was not a new Equity Intraday release, so no paper candidate was created."
                      )
                      return
                  }

                  processCandidateText(combined, n.packageName, allowRefresh = true)
              }

              private fun processCandidateText(combined: String, packageName: String, allowRefresh: Boolean) {
                  val symbols = catalog.cachedSymbols()
                  if (symbols.size >= 500) {
                      val symbol = catalog.matchNotification(combined, symbols)
                      if (symbol != null) {
                          acceptValidatedCandidate(symbol, combined, packageName)
                          return
                      }
                  }

                  if (allowRefresh) {
                      val now = System.currentTimeMillis()
                      if (now - lastCatalogRefreshAttempt >= 60_000L) {
                          lastCatalogRefreshAttempt = now
                          executor?.execute {
                              val refreshed = runCatching { catalog.loadOrRefresh(force = true) }
                                  .onFailure { e -> throttledLog("catalog", "Groww instrument catalog unavailable", e.message ?: "Instrument catalog refresh failed", "WARN") }
                                  .getOrNull()
                              if (refreshed != null && refreshed.size >= 500) {
                                  sanitize(refreshed)
                                  val retry = catalog.matchNotification(combined, refreshed)
                                  if (retry != null) acceptValidatedCandidate(retry, combined, packageName)
                                  else throttledLog("parse", "Candidate rejected", "Initial Multyfi intraday release did not contain one unambiguous valid NSE CASH trading symbol. No candidate was created.")
                              }
                          }
                          return
                      }
                  }

                  throttledLog("parse", "Candidate rejected", "Initial Multyfi intraday release did not contain one unambiguous valid NSE CASH trading symbol. No candidate was created.")
              }

              private fun acceptValidatedCandidate(symbol: String, combined: String, packageName: String) {
                  repo.acceptCandidate(symbol.uppercase(Locale.US), "MULTYFI INTRADAY", combined, packageName)
              }

              private fun startLoop() {
                  if (executor?.isShutdown == false) return
                  executor = Executors.newSingleThreadScheduledExecutor().also { ex ->
                      ex.scheduleWithFixedDelay({ safePoll() }, 1, 5, TimeUnit.SECONDS)
                  }
              }

              private fun stopLoop() {
                  executor?.shutdownNow()
                  executor = null
              }

              private fun refreshCatalogAndSanitize(force: Boolean): Set<String>? {
                  lastCatalogRefreshAttempt = System.currentTimeMillis()
                  return runCatching { catalog.loadOrRefresh(force) }
                      .onSuccess { symbols -> sanitize(symbols) }
                      .onFailure { e -> throttledLog("catalog", "Groww instrument catalog unavailable", e.message ?: "Instrument catalog refresh failed", "WARN") }
                      .getOrNull()
              }

              private fun sanitize(symbols: Set<String>) {
                  val result = sanitizer.purgeToday(symbols)
                  if (result.removedCandidates > 0) {
                      repo.logActivity(
                          "SYSTEM",
                          "Invalid candidates purged",
                          "Removed ${result.removedCandidates} semantically invalid/non-instrument candidate(s), ${result.removedTrades} linked trade event(s) and ${result.removedTicks} tick file(s). Today's contaminated learning result was invalidated.",
                          "INFO"
                      )
                  }
              }

              private fun safePoll() {
                  runCatching {
                      repo.markListenerHeartbeat()
                      val validSymbols = catalog.cachedSymbols().ifEmpty {
                          refreshCatalogAndSanitize(force = false) ?: return
                      }
                      if (validSymbols.size < 500) return

                      if (MarketClock.shouldForceFlat()) {
                          repo.todayCandidates()
                              .filter { it.symbol.uppercase(Locale.US) in validSymbols }
                              .forEach { c ->
                                  val flat = PaperEngine.forceFlat(repo, c)
                                  if (flat != c) repo.saveCandidate(flat)
                              }
                          val n = MarketClock.now()
                          if (n.hour >= 15 && n.minute >= 20 && !repo.learningUpToDate()) {
                              val r = ReplayEngine().learn(repo)
                              if (r.promoted) repo.saveConfig(r.championAfter)
                              repo.recordLearning(r)
                          }
                          return
                      }
                      if (!MarketClock.isTrackingWindow()) return
                      val token = repo.accessToken()
                      if (token.isBlank()) return

                      repo.todayCandidates()
                          .filter { it.status != "SESSION_LOCKED" }
                          .filter { it.symbol.uppercase(Locale.US) in validSymbols }
                          .forEach { c ->
                              runCatching {
                                  val q = GrowwClient.quote(token, c.symbol)
                                  repo.appendTick(c.id, q)
                                  val updated = PaperEngine.onQuote(repo, c, repo.ticks(c.id).takeLast(240))
                                  repo.saveCandidate(updated)
                              }.onFailure { e ->
                                  throttledLog("quote_${c.symbol}", "Market data error • ${c.symbol}", e.message ?: "Groww quote failed", "WARN")
                              }
                          }
                  }.onFailure { e -> throttledLog("loop", "Scanner loop error", e.message ?: "Unknown scanner error", "WARN") }
              }

              private fun throttledLog(key: String, title: String, detail: String, severity: String = "INFO") {
                  val now = System.currentTimeMillis()
                  val last = errorTimestamps[key] ?: 0L
                  if (now - last >= 60_000L) {
                      errorTimestamps[key] = now
                      repo.logActivity("SYSTEM", title, detail, severity)
                  }
              }
          }
          KOT

          cat > "$SRC/CandidateSanitizer.kt" <<'KOT'
          package com.multyfi.intraday.mobile

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.Locale

          class CandidateSanitizer(private val context: Context) {
              private val candidatesFile = File(context.filesDir, "candidates.json")
              private val tradesFile = File(context.filesDir, "trade_events.jsonl")
              private val activityFile = File(context.filesDir, "activity.jsonl")
              private val learningFile = File(context.filesDir, "learning_history.jsonl")
              private val ticksDir = File(context.filesDir, "ticks")
              private val prefs = context.getSharedPreferences("multyfi_v3", Context.MODE_PRIVATE)

              data class Result(val removedCandidates: Int, val removedTrades: Int, val removedTicks: Int)

              @Synchronized
              fun purgeToday(validSymbols: Set<String>): Result {
                  if (validSymbols.isEmpty() || !candidatesFile.exists()) return Result(0, 0, 0)
                  val today = MarketClock.dayKey()
                  val configuredPackage = prefs.getString("source_package", "") ?: ""
                  val all = runCatching {
                      val a = JSONArray(candidatesFile.readText())
                      (0 until a.length()).map { a.getJSONObject(it) }
                  }.getOrDefault(emptyList())
                  if (all.isEmpty()) return Result(0, 0, 0)

                  val invalid = all.filter { j ->
                      val ts = j.optLong("acceptedTs", 0L)
                      if (ts <= 0L || MarketClock.dayKey(ts) != today) return@filter false
                      val symbol = j.optString("symbol", "").uppercase(Locale.US)
                      val raw = j.optString("rawNotification", "")
                      val pkg = j.optString("notificationPackage", "")
                      symbol !in validSymbols ||
                          !MultyfiNotificationSemantics.isAllowedSourcePackage(pkg, configuredPackage) ||
                          !MultyfiNotificationSemantics.isCandidateCreationEvent(raw)
                  }
                  if (invalid.isEmpty()) return Result(0, 0, 0)

                  val invalidIds = invalid.mapNotNull { it.optString("id", "").takeIf(String::isNotBlank) }.toSet()
                  val invalidSymbols = invalid.map { it.optString("symbol", "").uppercase(Locale.US) }.toSet()
                  val keep = all.filterNot { it.optString("id", "") in invalidIds }
                  val out = JSONArray(); keep.forEach { out.put(it) }
                  candidatesFile.writeText(out.toString())

                  var removedTicks = 0
                  invalidIds.forEach { id ->
                      val f = File(ticksDir, id.replace(Regex("[^A-Za-z0-9_.-]"), "_") + ".jsonl")
                      if (f.exists() && f.delete()) removedTicks++
                  }

                  var removedTrades = 0
                  if (tradesFile.exists()) {
                      val kept = ArrayList<String>()
                      tradesFile.readLines().forEach { line ->
                          val remove = runCatching { JSONObject(line).optString("candidateId", "") in invalidIds }.getOrDefault(false)
                          if (remove) removedTrades++ else if (line.isNotBlank()) kept += line
                      }
                      tradesFile.writeText(if (kept.isEmpty()) "" else kept.joinToString("\n", postfix = "\n"))
                  }

                  if (activityFile.exists()) {
                      val kept = activityFile.readLines().filter { line ->
                          runCatching {
                              val j = JSONObject(line)
                              val ts = j.optLong("ts", 0L)
                              if (ts <= 0L || MarketClock.dayKey(ts) != today) return@runCatching true
                              val title = j.optString("title", "")
                              invalidSymbols.none { symbol ->
                                  title.equals("$symbol accepted", true) || title.equals("Market data error • $symbol", true)
                              }
                          }.getOrDefault(true)
                      }
                      activityFile.writeText(if (kept.isEmpty()) "" else kept.joinToString("\n", postfix = "\n"))
                  }

                  if (learningFile.exists()) {
                      val kept = learningFile.readLines().filter { line ->
                          runCatching {
                              val ts = JSONObject(line).optLong("ts", 0L)
                              ts <= 0L || MarketClock.dayKey(ts) != today
                          }.getOrDefault(true)
                      }
                      learningFile.writeText(if (kept.isEmpty()) "" else kept.joinToString("\n", postfix = "\n"))
                  }

                  val revisedEvidence = prefs.getLong("evidence_version", 0L) + 1L
                  prefs.edit()
                      .putLong("evidence_version", revisedEvidence)
                      .remove("last_learning_ts")
                      .remove("last_learning_evidence_version")
                      .apply()

                  return Result(invalid.size, removedTrades, removedTicks)
              }
          }
          KOT

          cat > "$SRC/SignalMath.kt" <<'KOT'
          package com.multyfi.intraday.mobile

          import kotlin.math.max
          import kotlin.math.sign
          import kotlin.math.sqrt
          import kotlin.math.tanh

          object SignalMath {
              fun latest(ticks: List<MarketTick>): SignalFeature {
                  if (ticks.isEmpty()) return SignalFeature(0L, 0.0, 0.0, 1.0, 0.0, "WAITING")
                  return series(ticks).last()
              }

              fun hasRecentContinuity(ticks: List<MarketTick>, horizonMs: Long = 60_000L, maxGapMs: Long = 20_000L): Boolean {
                  if (ticks.size < 5) return false
                  val end = ticks.last().ts
                  val recent = ticks.filter { it.ts >= end - horizonMs }
                  if (recent.size < 5) return false
                  if (end - recent.first().ts < 30_000L) return false
                  return recent.zipWithNext().all { (a, b) -> b.ts > a.ts && b.ts - a.ts <= maxGapMs }
              }

              fun series(ticks: List<MarketTick>): List<SignalFeature> {
                  if (ticks.isEmpty()) return emptyList()
                  val ordered = ticks.sortedBy { it.ts }
                  val n = ordered.size
                  val deltaVol = LongArray(n)
                  val cumulativePv = DoubleArray(n)
                  val cumulativeVol = LongArray(n)
                  for (i in 0 until n) {
                      val dv = if (i == 0) 0L else max(0L, ordered[i].volume - ordered[i - 1].volume)
                      deltaVol[i] = dv
                      cumulativeVol[i] = (if (i == 0) 0L else cumulativeVol[i - 1]) + dv
                      cumulativePv[i] = (if (i == 0) 0.0 else cumulativePv[i - 1]) + ordered[i].price * dv.toDouble()
                  }

                  fun indexAtOrBefore(i: Int, targetTs: Long): Int {
                      var j = i
                      while (j > 0 && ordered[j].ts > targetTs) j--
                      return j
                  }

                  fun pctAgo(i: Int, lookbackMs: Long): Double {
                      val target = ordered[i].ts - lookbackMs
                      val j = indexAtOrBefore(i, target)
                      val elapsed = ordered[i].ts - ordered[j].ts
                      if (elapsed < (lookbackMs * 0.65).toLong()) return 0.0
                      val base = ordered[j].price
                      return if (base > 0.0) (ordered[i].price / base - 1.0) * 100.0 else 0.0
                  }

                  fun volPct(i: Int): Double {
                      val startTs = ordered[i].ts - 60_000L
                      val start = indexAtOrBefore(i, startTs)
                      if (i - start < 3) return 0.08
                      val rs = ArrayList<Double>()
                      for (k in (start + 1)..i) {
                          val p0 = ordered[k - 1].price
                          val p1 = ordered[k].price
                          val dt = (ordered[k].ts - ordered[k - 1].ts).coerceAtLeast(1L) / 1000.0
                          if (p0 > 0.0 && dt <= 30.0) {
                              val raw = (p1 / p0 - 1.0) * 100.0
                              rs += raw / sqrt(max(1.0, dt / 5.0))
                          }
                      }
                      if (rs.size < 2) return 0.08
                      val m = rs.average()
                      val v = rs.sumOf { (it - m) * (it - m) } / rs.size.toDouble()
                      return max(0.03, sqrt(v))
                  }

                  fun volumeRate(i: Int, fromMsAgo: Long, toMsAgo: Long): Double {
                      val endTs = ordered[i].ts - toMsAgo
                      val startTs = ordered[i].ts - fromMsAgo
                      val endIdx = indexAtOrBefore(i, endTs)
                      val startIdx = indexAtOrBefore(endIdx, startTs)
                      val dt = (ordered[endIdx].ts - ordered[startIdx].ts) / 1000.0
                      if (dt < 10.0) return 0.0
                      val dv = max(0L, ordered[endIdx].volume - ordered[startIdx].volume).toDouble()
                      return dv / dt
                  }

                  fun rvol(i: Int): Double {
                      val recent = volumeRate(i, 30_000L, 0L)
                      val prior = volumeRate(i, 150_000L, 30_000L)
                      if (recent <= 0.0 || prior <= 0.0) return 1.0
                      return (recent / prior).coerceIn(0.20, 3.00)
                  }

                  return ordered.indices.map { i ->
                      val t = ordered[i]
                      val m1 = pctAgo(i, 60_000L)
                      val m3 = pctAgo(i, 180_000L)
                      val m5 = pctAgo(i, 300_000L)
                      val vol = volPct(i)
                      val vwap = when {
                          t.averagePrice > 0.0 -> t.averagePrice
                          cumulativeVol[i] > 0L -> cumulativePv[i] / cumulativeVol[i].toDouble()
                          else -> ordered.subList(max(0, i - 24), i + 1).map { it.price }.average()
                      }
                      val vwapPct = if (vwap > 0.0) (t.price / vwap - 1.0) * 100.0 else 0.0
                      val rv = rvol(i)
                      val denom = max(0.08, vol * 3.5)
                      val directionalRvol = sign(m1) * (rv - 1.0).coerceIn(-1.5, 1.5)
                      val raw = 0.42 * (m1 / denom) +
                          0.24 * (m3 / (denom * 1.5)) +
                          0.14 * (m5 / (denom * 2.0)) +
                          0.16 * (vwapPct / 0.30) +
                          0.04 * directionalRvol
                      val score = tanh(raw).coerceIn(-1.0, 1.0)
                      val trend = when {
                          score >= 0.72 -> "STRONG_RISING"
                          score >= 0.35 -> "RISING"
                          score <= -0.72 -> "STRONG_FALLING"
                          score <= -0.35 -> "FALLING"
                          else -> "MIXED"
                      }
                      SignalFeature(t.ts, t.price, score, rv, vwapPct, trend)
                  }
              }
          }
          KOT

          cat > "$SRC/PaperEngine.kt" <<'KOT'
          package com.multyfi.intraday.mobile

          import kotlin.math.floor
          import kotlin.math.max

          object PaperEngine {
              private fun sideReturnPct(side: String, entry: Double, price: Double): Double {
                  if (entry <= 0.0) return 0.0
                  val raw = (price / entry - 1.0) * 100.0
                  return if (side == "LONG") raw else -raw
              }

              private fun pnl(side: String, entry: Double, price: Double, qty: Int): Double =
                  if (side == "LONG") (price - entry) * qty else (entry - price) * qty

              fun onQuote(repo: AppRepository, c0: CandidateState, ticks: List<MarketTick>): CandidateState {
                  if (ticks.isEmpty()) return c0
                  val f = SignalMath.latest(ticks)
                  val continuousFeed = SignalMath.hasRecentContinuity(ticks)
                  var c = c0.copy(lastLtp = f.price, lastUpdatedTs = f.ts, score = f.score, rvol = f.rvol, vwapPct = f.vwapPct, trend = f.trend)

                  if (MarketClock.shouldForceFlat()) {
                      if (c.paperSide != "FLAT") c = close(repo, c, f, "15:15 IST force-flat")
                      return c.copy(status = "SESSION_LOCKED")
                  }

                  if (c.paperSide == "FLAT") {
                      if (MarketClock.canOpenNewPaperRisk() && continuousFeed) {
                          val cfg = repo.currentConfig()
                          if (f.score >= cfg.enter) c = open(repo, c, f, "LONG")
                          else if (f.score <= -cfg.enter) c = open(repo, c, f, "SHORT")
                      }
                      return c
                  }

                  val side = c.paperSide
                  val best = if (side == "LONG") max(c.bestPrice, f.price) else if (c.bestPrice <= 0.0) f.price else minOf(c.bestPrice, f.price)
                  c = c.copy(bestPrice = best)
                  val heldSeconds = (f.ts - c.entryTs) / 1000L
                  val currentRet = sideReturnPct(side, c.entryPrice, f.price)
                  val bestRet = sideReturnPct(side, c.entryPrice, best)
                  val cfg = repo.currentConfig()

                  val exitReason = when {
                      currentRet <= -repo.stopPct() -> "protective stop"
                      bestRet >= repo.trailActivationPct() && (bestRet - currentRet) >= repo.trailDistancePct() -> "profit trail"
                      continuousFeed && heldSeconds >= repo.minHoldSeconds() && side == "LONG" && f.score <= -cfg.flip -> "LONG thesis failed on confirmed reversal"
                      continuousFeed && heldSeconds >= repo.minHoldSeconds() && side == "SHORT" && f.score >= cfg.flip -> "SHORT thesis failed on confirmed reversal"
                      continuousFeed && heldSeconds >= repo.minHoldSeconds() && kotlin.math.abs(f.score) <= cfg.exit -> "signal faded below exit threshold"
                      else -> null
                  }

                  if (exitReason != null) {
                      val oldSide = c.paperSide
                      c = close(repo, c, f, exitReason)
                      if (continuousFeed && exitReason.contains("confirmed reversal") && MarketClock.canOpenNewPaperRisk()) {
                          c = open(repo, c, f, if (oldSide == "LONG") "SHORT" else "LONG", "confirmed flip")
                      }
                  }
                  return c
              }

              fun forceFlat(repo: AppRepository, c: CandidateState, reason: String = "15:15 IST force-flat"): CandidateState {
                  if (c.paperSide == "FLAT" || c.lastLtp <= 0.0) return c.copy(status = "SESSION_LOCKED")
                  val f = SignalFeature(System.currentTimeMillis(), c.lastLtp, c.score, c.rvol, c.vwapPct, c.trend)
                  return close(repo, c, f, reason).copy(status = "SESSION_LOCKED")
              }

              private fun open(repo: AppRepository, c: CandidateState, f: SignalFeature, side: String, reason: String = "signal confirmed"): CandidateState {
                  val qty = max(1, floor(repo.notional() / f.price).toInt())
                  val updated = c.copy(paperSide = side, entryPrice = f.price, entryTs = f.ts, qty = qty, bestPrice = f.price)
                  repo.logTrade(TradeEvent(f.ts, c.id, c.symbol, side, "OPEN", f.price, qty, 0.0, "$side $reason", f.score, f.rvol, f.vwapPct, 0.0))
                  return updated
              }

              private fun close(repo: AppRepository, c: CandidateState, f: SignalFeature, reason: String): CandidateState {
                  val realised = pnl(c.paperSide, c.entryPrice, f.price, c.qty)
                  val mfe = pnl(c.paperSide, c.entryPrice, c.bestPrice, c.qty).coerceAtLeast(0.0)
                  repo.logTrade(TradeEvent(f.ts, c.id, c.symbol, c.paperSide, "CLOSE", f.price, c.qty, realised, reason, f.score, f.rvol, f.vwapPct, mfe))
                  return c.copy(paperSide = "FLAT", entryPrice = 0.0, entryTs = 0L, qty = 0, bestPrice = 0.0, realisedPnl = c.realisedPnl + realised)
              }

              fun unrealisedPnl(c: CandidateState): Double {
                  if (c.paperSide == "FLAT" || c.entryPrice <= 0.0 || c.lastLtp <= 0.0) return 0.0
                  return pnl(c.paperSide, c.entryPrice, c.lastLtp, c.qty)
              }
          }
          KOT

          python3 - <<'PY'
          from pathlib import Path
          base = Path('Multyfi_Intraday_Mobile_V3_0')

          p = base/'app/build.gradle.kts'
          s = p.read_text().replace('versionCode = 304', 'versionCode = 305').replace('versionName = "3.0.4"', 'versionName = "3.0.5"')
          p.write_text(s)

          p = base/'app/src/main/java/com/multyfi/intraday/mobile/DiagnosticExporter.kt'
          s = p.read_text()
          s = s.replace('appendLine("MULTYFI INTRADAY MOBILE V3.0.1 — FULL DAILY DIAGNOSTIC")', 'appendLine("MULTYFI INTRADAY MOBILE V${BuildConfig.VERSION_NAME} — FULL DAILY DIAGNOSTIC")')
          s = s.replace('appendLine("App version: 3.0.1")', 'appendLine("App version: ${BuildConfig.VERSION_NAME}")')
          p.write_text(s)

          p = base/'app/src/main/java/com/multyfi/intraday/mobile/AppRepository.kt'
          s = p.read_text()
          needle = '    @Synchronized\n    fun recordLearning(r: LearningResult) {\n'
          repl = '    @Synchronized\n    fun recordLearning(r: LearningResult) {\n        if (lastLearningTs() > 0L && lastLearningEvidenceVersion() == r.evidenceVersion) return\n'
          if needle not in s: raise SystemExit('recordLearning hook not found')
          s = s.replace(needle, repl, 1)
          p.write_text(s)

          p = base/'app/src/main/java/com/multyfi/intraday/mobile/ReplayEngine.kt'
          s = p.read_text()
          needle = '    fun learn(repo: AppRepository): LearningResult {\n        val now = System.currentTimeMillis()\n'
          repl = '''    fun learn(repo: AppRepository): LearningResult {\n        repo.lastLearning()?.let { previous ->\n            if (repo.learningUpToDate() && previous.evidenceVersion == repo.evidenceVersion()) return previous\n        }\n        val now = System.currentTimeMillis()\n'''
          if needle not in s: raise SystemExit('ReplayEngine learn hook not found')
          s = s.replace(needle, repl, 1)
          s = s.replace('.mapNotNull { (id, ticks) -> if (ticks.size >= 24) id to SignalMath.series(ticks) else null }', '.mapNotNull { (id, ticks) -> if (ticks.size >= 24 && ticks.last().ts - ticks.first().ts >= 300_000L) id to SignalMath.series(ticks) else null }')
          p.write_text(s)
          PY

          grep -q 'versionCode = 305' Multyfi_Intraday_Mobile_V3_0/app/build.gradle.kts
          grep -q 'versionName = "3.0.5"' Multyfi_Intraday_Mobile_V3_0/app/build.gradle.kts
          grep -q 'INTRADAY_RELEASE' "$SRC/MultyfiNotificationSemantics.kt"
          grep -q 'Only genuine initial Multyfi Equity Intraday releases' "$SRC/MultyfiNotificationService.kt"
          grep -q 'MultyfiNotificationSemantics.isCandidateCreationEvent' "$SRC/CandidateSanitizer.kt"
          grep -q 'pctAgo(i, 60_000L)' "$SRC/SignalMath.kt"
          grep -q 'hasRecentContinuity' "$SRC/PaperEngine.kt"
          grep -q 'lastLearningEvidenceVersion() == r.evidenceVersion' "$SRC/AppRepository.kt"
          grep -q 'BuildConfig.VERSION_NAME' "$SRC/DiagnosticExporter.kt"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: Multyfi_Intraday_Mobile_V3_0
        run: gradle --no-daemon --console=plain clean assembleRelease

      - name: Restore V3 update signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/multyfi-v3-signing
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10109117099/zip" \
            -o /tmp/multyfi-v3-signing/previous.zip
          unzip -j /tmp/multyfi-v3-signing/previous.zip \
            'Multyfi-Intraday-V3-Update-Key.jks' \
            'SIGNING-PASSWORD.txt' \
            'Multyfi_Intraday_Mobile_V3_0_SIGNED.apk' \
            -d /tmp/multyfi-v3-signing
          test -s /tmp/multyfi-v3-signing/Multyfi-Intraday-V3-Update-Key.jks
          test -s /tmp/multyfi-v3-signing/SIGNING-PASSWORD.txt
          test -s /tmp/multyfi-v3-signing/Multyfi_Intraday_Mobile_V3_0_SIGNED.apk

      - name: Sign and verify V3.0.5 update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UNSIGNED='Multyfi_Intraday_Mobile_V3_0/app/build/outputs/apk/release/app-release-unsigned.apk'
          ALIGNED='out/Multyfi-Intraday-Mobile-V3.0.5-aligned.apk'
          SIGNED='out/Multyfi_Intraday_Mobile_V3_0_5_DATA_QUALITY_SIGNED_UPDATE.apk'
          KEYSTORE='/tmp/multyfi-v3-signing/Multyfi-Intraday-V3-Update-Key.jks'
          PASS="$(tr -d '\r\n' < /tmp/multyfi-v3-signing/SIGNING-PASSWORD.txt)"
          OLD_APK='/tmp/multyfi-v3-signing/Multyfi_Intraday_Mobile_V3_0_SIGNED.apk'
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$ZIPALIGN" -P 16 -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee out/APK-SIGNATURE-VERIFY.txt
          "$AAPT" dump badging "$SIGNED" | tee out/APK-BADGING.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$SIGNED" | tee out/ZIPALIGN-VERIFY.txt
          unzip -t "$SIGNED" | tee out/ZIP-INTEGRITY.txt

          OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          NEW_CERT="$("$APKSIGNER" verify --print-certs "$SIGNED" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT"
          printf 'Previous signer SHA-256: %s\nNew signer SHA-256: %s\nMATCH: YES\n' "$OLD_CERT" "$NEW_CERT" | tee out/UPDATE-SIGNER-MATCH.txt

          grep -q "package: name='com.multyfi.intraday.mobile'" out/APK-BADGING.txt
          grep -q "versionCode='305'" out/APK-BADGING.txt
          grep -q "versionName='3.0.5'" out/APK-BADGING.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'No errors detected' out/ZIP-INTEGRITY.txt
          sha256sum "$SIGNED" | tee out/SHA256.txt

      - name: Upload verified V3.0.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-V3.0.5-DATA-QUALITY
          path: |
            out/Multyfi_Intraday_Mobile_V3_0_5_DATA_QUALITY_SIGNED_UPDATE.apk
            out/APK-SIGNATURE-VERIFY.txt
            out/APK-BADGING.txt
            out/ZIPALIGN-VERIFY.txt
            out/ZIP-INTEGRITY.txt
            out/UPDATE-SIGNER-MATCH.txt
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
