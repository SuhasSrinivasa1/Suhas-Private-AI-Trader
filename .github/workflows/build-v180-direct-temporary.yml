name: Direct NSE Intraday Momentum v1.9.0 verified build

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-v190:
    if: contains(github.event.pull_request.title, '[BUILD-V190]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout v1.9 source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reconstruct v1.8 and apply v1.9
        shell: bash
        run: |
          set -euo pipefail
          cat nse-v160-b64.part.00 nse-v160-b64.part.01 nse-v160-b64.part.02 nse-v160-b64.part.03 nse-v160-b64.part.04 nse-v160-b64.part.05 nse-v160-b64.part.06 | base64 -d > /tmp/nse-v160.tar.xz
          tar -xJf /tmp/nse-v160.tar.xz
          bash apply-v170.sh
          bash apply-v180.sh
          bash apply-v190.sh
          grep -q "versionCode 190" nse-intraday-v190/app/build.gradle
          grep -q "versionName '1.9.0'" nse-intraday-v190/app/build.gradle
          grep -q 'TARGET_HITS_PER_HOUR=5' nse-intraday-v190/app/src/main/java/com/suhas/nsedeliverymomentum/HourlyAdaptiveLearning.java
          grep -q 'MAX_RATE=3.0' nse-intraday-v190/app/src/main/java/com/suhas/nsedeliverymomentum/HourlyAdaptiveLearning.java
          grep -q 'hourly_report' nse-intraday-v190/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java
          grep -q 'notifySignal("LONG"' nse-intraday-v190/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java
          grep -q 'notifySignal("SHORT"' nse-intraday-v190/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and lint
        working-directory: nse-intraday-v190
        run: gradle --no-daemon --console=plain clean testDebugUnitTest lintDebug

      - name: Assemble release
        working-directory: nse-intraday-v190
        run: gradle --no-daemon --console=plain assembleRelease

      - name: Fresh sign and verify
        working-directory: nse-intraday-v190
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UNSIGNED='app/build/outputs/apk/release/app-release-unsigned.apk'
          SIGNED='out/NSE-Intraday-Momentum-S24-v1.9.0-HOURLY-ADAPTIVE-FRESH-SIGNED.apk'
          test -s "$UNSIGNED"
          keytool -genkeypair -v -keystore /tmp/v190.jks -storepass changeit -keypass changeit -alias nse-v190 -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=NSE Intraday Momentum v1.9.0, OU=Private Build, O=NSE Intraday Momentum, L=Bengaluru, ST=Karnataka, C=IN'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" sign --ks /tmp/v190.jks --ks-pass pass:changeit --key-pass pass:changeit --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee out/APK-SIGNATURE-VERIFY.txt
          "$AAPT" dump badging "$SIGNED" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.nsedeliverymomentum'" out/APK-BADGING.txt
          grep -q "versionCode='190'" out/APK-BADGING.txt
          grep -q "versionName='1.9.0'" out/APK-BADGING.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/APK-SIGNATURE-VERIFY.txt
          sha256sum "$SIGNED" | tee out/SHA256.txt

      - name: Android 16 install and cold launch
        working-directory: nse-intraday-v190
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          OUT=out
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          AVD_PATH="$ANDROID_AVD_HOME/nse_v190_api36.avd"
          echo no | avdmanager create avd --force --name nse_v190_api36 --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_8_pro' --path "$AVD_PATH" > "$OUT/avd-create.log" 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd nse_v190_api36 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none > "$OUT/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          booted=0
          for i in $(seq 1 90); do
            state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$state" = "1" ]; then booted=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then break; fi
            sleep 3
          done
          test "$booted" = "1"
          adb install "$OUT/NSE-Intraday-Momentum-S24-v1.9.0-HOURLY-ADAPTIVE-FRESH-SIGNED.apk" | tee "$OUT/install-api36.txt"
          grep -q Success "$OUT/install-api36.txt"
          adb shell pm grant com.suhas.nsedeliverymomentum android.permission.POST_NOTIFICATIONS || true
          adb logcat -c
          adb shell am start -W -n com.suhas.nsedeliverymomentum/.MainActivity | tee "$OUT/cold-launch-api36.txt"
          sleep 8
          adb shell dumpsys activity activities > "$OUT/activity-api36.txt"
          grep -Eq '(topResumedActivity|ResumedActivity|mResumedActivity).*com.suhas.nsedeliverymomentum/.MainActivity' "$OUT/activity-api36.txt"
          test -n "$(adb shell pidof com.suhas.nsedeliverymomentum | tr -d '\r')"
          adb logcat -d -v threadtime > "$OUT/logcat-api36.txt"
          if grep -E 'FATAL EXCEPTION|Process: com.suhas.nsedeliverymomentum|ClassNotFoundException.*com.suhas.nsedeliverymomentum' "$OUT/logcat-api36.txt"; then exit 1; fi
          echo 'PASS: Android 16 install and cold launch' | tee "$OUT/INSTALL-ACCEPTANCE.txt"

      - name: Upload verified APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Intraday-Momentum-S24-v1.9.0-HOURLY-ADAPTIVE-VERIFIED
          path: |
            nse-intraday-v190/out/NSE-Intraday-Momentum-S24-v1.9.0-HOURLY-ADAPTIVE-FRESH-SIGNED.apk
            nse-intraday-v190/out/APK-SIGNATURE-VERIFY.txt
            nse-intraday-v190/out/APK-BADGING.txt
            nse-intraday-v190/out/SHA256.txt
            nse-intraday-v190/out/INSTALL-ACCEPTANCE.txt
            nse-intraday-v190/out/install-api36.txt
            nse-intraday-v190/out/cold-launch-api36.txt
            nse-intraday-v190/out/logcat-api36.txt
          if-no-files-found: error
          retention-days: 30
