name: Direct temporary build NSE Intraday Momentum v1.8.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v180-direct-temporary.yml'

permissions:
  contents: read

jobs:
  build-v180:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated v1.8 source branch
        uses: actions/checkout@v4
        with:
          ref: build/nse-delivery-v1.7.0-housekeeping2

      - name: Reconstruct v1.8 source
        shell: bash
        run: |
          set -euo pipefail
          cat nse-v160-b64.part.00 nse-v160-b64.part.01 nse-v160-b64.part.02 nse-v160-b64.part.03 nse-v160-b64.part.04 nse-v160-b64.part.05 nse-v160-b64.part.06 | base64 -d > /tmp/nse-v160.tar.xz
          tar -xJf /tmp/nse-v160.tar.xz
          bash apply-v170.sh
          bash apply-v180.sh
          test -f nse-intraday-v180/app/build.gradle
          grep -q "versionCode 180" nse-intraday-v180/app/build.gradle
          grep -q "versionName '1.8.0'" nse-intraday-v180/app/build.gradle
          grep -q 'android.permission.POST_NOTIFICATIONS' nse-intraday-v180/app/src/main/AndroidManifest.xml
          grep -q 'notifySignal("LONG"' nse-intraday-v180/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java
          grep -q 'notifySignal("SHORT"' nse-intraday-v180/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        working-directory: nse-intraday-v180
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: nse-intraday-v180
        run: gradle --no-daemon lintRelease

      - name: Assemble release
        working-directory: nse-intraday-v180
        run: gradle --no-daemon assembleRelease

      - name: Fresh sign and verify
        working-directory: nse-intraday-v180
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='app/build/outputs/apk/release/app-release-unsigned.apk'
          SIGNED='NSE-Intraday-Momentum-v1.8.0-FRESH-SIGNED.apk'
          test -s "$UNSIGNED"
          keytool -genkeypair -v -keystore fresh-v180.jks -storepass changeit -keypass changeit -alias nse-v180 -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=NSE Intraday Momentum v1.8.0, OU=Private Build, O=NSE Intraday Momentum, L=Bengaluru, ST=Karnataka, C=IN'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign --ks fresh-v180.jks --ks-pass pass:changeit --key-pass pass:changeit --out "$SIGNED" "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee APK-SIGNATURE-VERIFY.txt
          sha256sum "$SIGNED" > SHA256.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Intraday-Momentum-v1.8.0-FRESH-SIGNED
          path: |
            nse-intraday-v180/NSE-Intraday-Momentum-v1.8.0-FRESH-SIGNED.apk
            nse-intraday-v180/APK-SIGNATURE-VERIFY.txt
            nse-intraday-v180/SHA256.txt
          if-no-files-found: error
          retention-days: 30
