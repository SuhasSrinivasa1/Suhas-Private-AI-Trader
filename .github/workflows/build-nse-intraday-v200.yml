name: Build NSE Intraday Momentum v2.0 Live Candle Fusion (manual archive)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Archived workflow notice
        run: |
          echo "The v2.0 NSE build is retained for manual historical use only."
          echo "It no longer runs automatically on unrelated pull requests."
