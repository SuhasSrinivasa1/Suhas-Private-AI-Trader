name: Fresh Multyfi Delivery Buy APK

on:
  push:
    branches: [ fresh-instant-delivery-20260825 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v1.1.0 source package
        shell: bash
        run: |
          set -euo pipefail
          cat fresh-delivery-source-v101/chunk1.b64 fresh-delivery-source-v101/chunk2.b64 fresh-delivery-source-v101/chunk3.b64 fresh-delivery-source-v101/chunk4.b64 | tr -d '\r\n' | base64 -d > fresh-delivery-buy-source-v1.0.1.zip
          mkdir -p fresh-delivery-buy
          unzip -q fresh-delivery-buy-source-v1.0.1.zip -d fresh-delivery-buy

          cp patch-v110/app/build.gradle fresh-delivery-buy/app/build.gradle
          cp patch-v110/README.md fresh-delivery-buy/README.md
          cp patch-v110/scripts/validate_contract.py fresh-delivery-buy/scripts/validate_contract.py
          cp patch-v110/app/src/main/java/com/suhas/multyfideliverybuy/AppPrefs.java fresh-delivery-buy/app/src/main/java/com/suhas/multyfideliverybuy/AppPrefs.java
          cp patch-v110/app/src/main/java/com/suhas/multyfideliverybuy/InstrumentRepository.java fresh-delivery-buy/app/src/main/java/com/suhas/multyfideliverybuy/InstrumentRepository.java

          cat patch-v110/remaining-src-00.b64 patch-v110/remaining-src-01.b64 patch-v110/remaining-src-02.b64 patch-v110/remaining-src-03.b64 patch-v110/remaining-src-04.b64 | tr -d '\r\n' | base64 -d > /tmp/v110-remaining.zip
          unzip -qo /tmp/v110-remaining.zip -d fresh-delivery-buy
          cp patch-v110/scripts/short_target_day_limit_fix.py fresh-delivery-buy/scripts/short_target_day_limit_fix.py
          cd fresh-delivery-buy
          python3 scripts/short_target_day_limit_fix.py
          cd ..

          test -f fresh-delivery-buy/app/src/main/java/com/suhas/multyfideliverybuy/GrowwClient.java
          test -f fresh-delivery-buy/app/src/main/java/com/suhas/multyfideliverybuy/InstrumentRepository.java
          test -f fresh-delivery-buy/app/src/test/java/com/suhas/multyfideliverybuy/ManualTradeTest.java
          grep -q "versionName '1.1.0'" fresh-delivery-buy/app/build.gradle
          grep -q 'submitShortCoverLimit' fresh-delivery-buy/app/src/main/java/com/suhas/multyfideliverybuy/GrowwClient.java

      - name: Bundle current NSE CASH equity universe
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 10 --max-time 45 \
            https://growwapi-assets.groww.in/instruments/instrument.csv \
            -o /tmp/groww-instrument.csv
          mkdir -p fresh-delivery-buy/app/src/main/assets
          python3 - <<'PY'
          import csv
          src = '/tmp/groww-instrument.csv'
          dst = 'fresh-delivery-buy/app/src/main/assets/nse_cash_eq.csv'
          n = 0
          with open(src, newline='', encoding='utf-8-sig') as f, open(dst, 'w', newline='', encoding='utf-8') as o:
              r = csv.DictReader(f)
              w = csv.writer(o)
              w.writerow(['trading_symbol','name','tick_size','buy_allowed','sell_allowed'])
              for raw in r:
                  row = {str(k or '').strip().lower(): str(v or '').strip() for k, v in raw.items()}
                  if row.get('exchange','').upper() != 'NSE':
                      continue
                  if row.get('segment','').upper() != 'CASH':
                      continue
                  if row.get('instrument_type','').upper() != 'EQ':
                      continue
                  series = row.get('series','').upper()
                  if series and series != 'EQ':
                      continue
                  if row.get('is_reserved','').lower() in ('1','true','yes'):
                      continue
                  buy = row.get('buy_allowed','0')
                  sell = row.get('sell_allowed','0')
                  yes = lambda x: str(x).lower() in ('1','true','yes')
                  if not yes(buy) and not yes(sell):
                      continue
                  symbol = row.get('trading_symbol','').strip()
                  if not symbol:
                      continue
                  w.writerow([symbol, row.get('name','').strip(), row.get('tick_size','0.05'), buy, sell])
                  n += 1
          print('Bundled NSE CASH EQ instruments:', n)
          if n < 100:
              raise SystemExit('Instrument snapshot unexpectedly small')
          PY
          head -3 fresh-delivery-buy/app/src/main/assets/nse_cash_eq.csv

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate v1.1.0 contract
        working-directory: fresh-delivery-buy
        run: python3 scripts/validate_contract.py

      - name: Unit tests
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:testReleaseUnitTest

      - name: Restore existing signing identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior-artifact fresh-delivery-buy/signing-restored
          gh run download 32811025252 --repo "${{ github.repository }}" -n multyfi-delivery-buy-fresh-v101 -D prior-artifact
          unzip -q prior-artifact/Multyfi-Delivery-Buy-v1.0.1-SIGNING-BACKUP.zip -d fresh-delivery-buy/signing-restored
          PASS="$(sed -n 's/^Store password: //p' fresh-delivery-buy/signing-restored/SIGNING-BACKUP.txt)"
          test -n "$PASS"
          echo "::add-mask::$PASS"
          cp fresh-delivery-buy/signing-restored/fresh-delivery-release.p12 fresh-delivery-buy/fresh-delivery-release.p12
          cp fresh-delivery-buy/signing-restored/SIGNING-BACKUP.txt fresh-delivery-buy/SIGNING-BACKUP.txt
          keytool -list -v -keystore fresh-delivery-buy/fresh-delivery-release.p12 -storetype PKCS12 -storepass "$PASS" -alias deliverybuy > signing-cert.txt
          grep -qi 'E0:B1:C6:11:90:9C:F0:87:9B:19:D5:3F:24:54:70:80:49:F0:76:AB:F4:CF:96:DE:E0:1C:58:D6:5B:78:BE:97' signing-cert.txt
          echo "RELEASE_STORE_FILE=$PWD/fresh-delivery-buy/fresh-delivery-release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=deliverybuy" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify and package
        working-directory: fresh-delivery-buy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/signing-backup
          cp app/build/outputs/apk/release/app-release.apk output/Multyfi-Delivery-Buy-FRESH-v1.1.0.apk
          cp fresh-delivery-release.p12 output/signing-backup/
          cp SIGNING-BACKUP.txt output/signing-backup/
          (cd output/signing-backup && zip -q ../Multyfi-Delivery-Buy-v1.1.0-SIGNING-BACKUP.zip fresh-delivery-release.p12 SIGNING-BACKUP.txt)
          rm -rf output/signing-backup
          sha256sum output/Multyfi-Delivery-Buy-FRESH-v1.1.0.apk | tee output/APK-SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/Multyfi-Delivery-Buy-FRESH-v1.1.0.apk | tee output/APK-SIGNATURE-VERIFY.txt
          grep -qi 'e0b1c611909cf0879b19d53f2454708049f076abf4cf96dee01c58d65b78be97' output/APK-SIGNATURE-VERIFY.txt
          python3 scripts/validate_contract.py | tee output/CONTRACT-VALIDATION.txt
          {
            echo "Multyfi Delivery Buy FRESH v1.1.0"
            echo "Package: com.suhas.multyfideliverybuy"
            echo "Same signing identity as v1.0.1 for in-place update."
            echo "Existing Multyfi automation unchanged: Intraday INR 1,00,000 CNC MARKET BUY; Swing/Multibagger INR 10,000 CNC MARKET BUY when enabled; closure notifications ignored."
            echo "Manual budget: INR 0..1,00,000 slider in INR 10,000 steps; default INR 50,000."
            echo "Manual LONG: one LTP read for sizing -> CNC MARKET BUY -> brief order-detail fill confirmation -> +1% broker-hosted CNC GTT LIMIT SELL target."
            echo "Manual SHORT: one LTP read for sizing -> MIS MARKET SELL -> brief order-detail fill confirmation -> -1% DAY MIS LIMIT BUY-to-cover target."
            echo "SHORT deliberately uses a DAY cover order rather than a persistent GTT so an unfilled target does not survive the intraday position into a later session."
            echo "No stop-loss, trailing, P&L engine, candles, re-entry, position/holdings polling, order modification or cancellation logic."
            echo "The app does not continuously monitor stock prices after target placement."
            echo "NSE CASH EQ autocomplete snapshot bundled from Groww official instrument CSV during this build and refreshable by the app."
          } > output/RELEASE-NOTES.txt
          {
            echo "Install Multyfi-Delivery-Buy-FRESH-v1.1.0.apk directly over v1.0.1."
            echo "Do not uninstall first if you want saved credentials/settings retained."
            echo "Package name and signing certificate are unchanged."
            echo "Manual LONG/SHORT buttons require the same static-IP match and successful Groww authentication readiness."
            echo "For LONG, the +1% target is a broker-hosted GTT SELL. For SHORT, entry is MIS SELL and the -1% target is a DAY LIMIT BUY-to-cover."
          } > output/INSTALL-v1.1.0.txt
          zip -qr output/fresh-delivery-buy-source-v1.1.0.zip . -x '.gradle/*' 'app/build/*' 'output/*' 'fresh-delivery-release.p12' 'SIGNING-BACKUP.txt' 'signing-restored/*'

      - name: Upload APK and private handoff
        uses: actions/upload-artifact@v4
        with:
          name: multyfi-delivery-buy-fresh-v110
          path: fresh-delivery-buy/output/*
          if-no-files-found: error
          retention-days: 30
