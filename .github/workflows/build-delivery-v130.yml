name: Build Delivery Trade Hub v1.4.0

on:
  push:
    branches: [ delivery-v130-build-20260909 ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact v1.3.0 source and apply v1.4.0 patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            fresh-delivery-source-v130/part00.b64 \
            fresh-delivery-source-v130/part01.b64 \
            fresh-delivery-source-v130/part02.b64 \
            fresh-delivery-source-v130/part03.b64 \
            fresh-delivery-source-v130/part04.b64 \
            fresh-delivery-source-v130/tail08a.b64 \
            fresh-delivery-source-v130/part05a2.b64 \
            fresh-delivery-source-v130/part05b.b64 \
            fresh-delivery-source-v130/part06a.b64 \
            fresh-delivery-source-v130/part06b.b64 \
            fresh-delivery-source-v130/part07.b64 \
            | tr -d '\r\n' | base64 -d > /tmp/v130.zip
          unzip -t /tmp/v130.zip
          mkdir -p fresh-delivery-buy
          unzip -q /tmp/v130.zip -d fresh-delivery-buy
          cd fresh-delivery-buy
          python3 ../patch-v140/apply_v140.py
          python3 ../patch-v140/fix_java_strings.py
          python3 scripts/validate_contract.py
          grep -q "versionName '1.4.0'" app/build.gradle
          grep -q 'Delivery Trade Hub' app/src/main/AndroidManifest.xml
          grep -q '\\n\\nMULTYFI EQUITY:' app/src/main/java/com/suhas/multyfideliverybuy/MainActivity.java
          cd ..

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate v1.4.0 contract
        working-directory: fresh-delivery-buy
        run: python3 scripts/validate_contract.py

      - name: Unit tests
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:testReleaseUnitTest

      - name: Generate fresh signing identity
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          cd fresh-delivery-buy
          keytool -genkeypair \
            -alias deliverybuy \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Delivery Trade Hub v1.4, OU=Private Build, O=Personal, L=Bengaluru, ST=Karnataka, C=IN" \
            -keystore delivery-trade-hub-release.p12 \
            -storetype PKCS12 \
            -storepass "$PASS" \
            -keypass "$PASS"
          {
            echo "Delivery Trade Hub v1.4.0 signing backup"
            echo "Keystore: delivery-trade-hub-release.p12"
            echo "Alias: deliverybuy"
            echo "Store password: $PASS"
            echo "Key password: $PASS"
            echo "IMPORTANT: Keep this backup for every future in-place update."
          } > SIGNING-BACKUP.txt
          echo "RELEASE_STORE_FILE=$PWD/delivery-trade-hub-release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=deliverybuy" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify and package
        working-directory: fresh-delivery-buy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/signing-backup
          cp app/build/outputs/apk/release/app-release.apk output/Delivery-Trade-Hub-v1.4.0.apk
          cp delivery-trade-hub-release.p12 output/signing-backup/
          cp SIGNING-BACKUP.txt output/signing-backup/
          (cd output/signing-backup && zip -q ../Delivery-Trade-Hub-v1.4.0-SIGNING-BACKUP.zip delivery-trade-hub-release.p12 SIGNING-BACKUP.txt)
          rm -rf output/signing-backup
          sha256sum output/Delivery-Trade-Hub-v1.4.0.apk | tee output/APK-SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/Delivery-Trade-Hub-v1.4.0.apk | tee output/APK-SIGNATURE-VERIFY.txt
          python3 scripts/validate_contract.py | tee output/CONTRACT-VALIDATION.txt
          cp README.md output/README-v1.4.0.md
          zip -qr output/delivery-trade-hub-source-v1.4.0.zip . \
            -x '.gradle/*' 'app/build/*' 'output/*' 'delivery-trade-hub-release.p12' 'SIGNING-BACKUP.txt'
          {
            echo "Delivery Trade Hub v1.4.0"
            echo "Fresh install / fresh signing identity. Previous app was intentionally uninstalled."
            echo "After installation, re-enable Android Notification Access and configure Groww static IP + TOTP authentication."
            echo "Univest equity is always CASH/CNC DELIVERY and never MIS."
            echo "Multyfi equity entry is always CASH/CNC DELIVERY, even when Multyfi labels the source call Intraday."
            echo "Multyfi primary delivery target is +0.5% estimated NET profit with first-spike fallback."
            echo "Only manual SHORT and Multyfi close-triggered short use MIS intraday."
            echo "Keep Delivery-Trade-Hub-v1.4.0-SIGNING-BACKUP.zip for future updates."
          } > output/INSTALL-v1.4.0.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: delivery-trade-hub-v140
          path: fresh-delivery-buy/output/*
          if-no-files-found: error
          retention-days: 30
