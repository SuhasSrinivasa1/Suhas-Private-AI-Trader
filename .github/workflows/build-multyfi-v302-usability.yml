name: Build Multyfi V3.0.8 Adaptive Polling

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-v308-adaptive-polling:
    if: contains(github.event.pull_request.title, '[BUILD-MULTYFI-V3]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reuse verified V3.0.7 transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-multyfi-v307-dynamic-risk.yml').read_text().splitlines()
          def extract(step_name, out):
              start = next(i for i,l in enumerate(wf) if l.strip() == f'- name: {step_name}')
              run_i = next(i for i in range(start+1, len(wf)) if wf[i].strip() == 'run: |')
              run_indent = len(wf[run_i]) - len(wf[run_i].lstrip())
              body = []
              for line in wf[run_i+1:]:
                  if line.strip() == '':
                      body.append('')
                      continue
                  indent = len(line) - len(line.lstrip())
                  if indent <= run_indent:
                      break
                  body.append(line[min(len(line), run_indent+2):])
              Path(out).write_text('\n'.join(body) + '\n')
          extract('Reuse verified V3.0.6 transformation', '/tmp/v307_base.sh')
          extract('Apply V3.0.7 budget-only dynamic risk', '/tmp/v307_dynamic.sh')
          PY
          bash /tmp/v307_base.sh
          bash /tmp/v307_dynamic.sh

      - name: Apply V3.0.8 adaptive polling and evidence UI
        shell: bash
        run: |
          set -euo pipefail
          BASE='Multyfi_Intraday_Mobile_V3_0'
          SRC="$BASE/app/src/main/java/com/multyfi/intraday/mobile"
          python3 - <<'PY'
          from pathlib import Path
          base = Path('Multyfi_Intraday_Mobile_V3_0')
          src = base/'app/src/main/java/com/multyfi/intraday/mobile'

          p = base/'app/build.gradle.kts'
          s = p.read_text().replace('versionCode = 307', 'versionCode = 308').replace('versionName = "3.0.7"', 'versionName = "3.0.8"')
          p.write_text(s)

          p = src/'MultyfiNotificationService.kt'
          s = p.read_text()
          hook = '    @Volatile private var lastCatalogRefreshAttempt = 0L\n'
          if hook not in s: raise SystemExit('service state hook not found')
          s = s.replace(hook, hook + '    @Volatile private var quoteCursor = 0\n', 1)
          old_sched = '            ex.scheduleWithFixedDelay({ safePoll() }, 1, 5, TimeUnit.SECONDS)\n'
          new_sched = '            ex.scheduleWithFixedDelay({ safePoll() }, 1, 250, TimeUnit.MILLISECONDS)\n'
          if old_sched not in s: raise SystemExit('service scheduler hook not found')
          s = s.replace(old_sched, new_sched, 1)
          start = s.index('    private fun safePoll() {')
          end = s.index('    private fun throttledLog(', start)
          new_safe = '\n'.join([
              '    private fun safePoll() {',
              '        runCatching {',
              '            repo.markListenerHeartbeat()',
              '            val validSymbols = catalog.cachedSymbols().ifEmpty {',
              '                refreshCatalogAndSanitize(force = false) ?: return',
              '            }',
              '            if (validSymbols.size < 500) return',
              '',
              '            if (MarketClock.shouldForceFlat()) {',
              '                repo.todayCandidates()',
              '                    .filter { it.symbol.uppercase(Locale.US) in validSymbols }',
              '                    .forEach { c ->',
              '                        val flat = PaperEngine.forceFlat(repo, c)',
              '                        LiveTradeEngine.sync(repo, c, flat)',
              '                        if (flat != c) repo.saveCandidate(flat)',
              '                    }',
              '                val n = MarketClock.now()',
              '                if (n.hour >= 15 && n.minute >= 20 && !repo.learningUpToDate()) {',
              '                    val r = ReplayEngine().learn(repo)',
              '                    if (r.promoted) repo.saveConfig(r.championAfter)',
              '                    repo.recordLearning(r)',
              '                }',
              '                return',
              '            }',
              '            if (!MarketClock.isTrackingWindow()) return',
              '            val token = repo.accessToken()',
              '            if (token.isBlank()) return',
              '',
              '            val active = repo.todayCandidates()',
              '                .filter { it.status != "SESSION_LOCKED" }',
              '                .filter { it.symbol.uppercase(Locale.US) in validSymbols }',
              '            if (active.isEmpty()) return',
              '',
              '            // One request per 250ms fixed-delay invocation on one executor.',
              '            // Maximum theoretical quote cadence: 4/sec = 240/min.',
              '            val idx = Math.floorMod(quoteCursor, active.size)',
              '            val c = active[idx]',
              '            quoteCursor = if (quoteCursor == Int.MAX_VALUE) 0 else quoteCursor + 1',
              '',
              '            runCatching {',
              '                val q = GrowwClient.quote(token, c.symbol)',
              '                repo.appendTick(c.id, q)',
              '                val updated = PaperEngine.onQuote(repo, c, repo.ticks(c.id).takeLast(180))',
              '                LiveTradeEngine.sync(repo, c, updated)',
              '                repo.saveCandidate(updated)',
              '            }.onFailure { e ->',
              '                throttledLog("quote_${c.symbol}", "Market data error • ${c.symbol}", e.message ?: "Groww quote failed", "WARN")',
              '            }',
              '        }.onFailure { e -> throttledLog("loop", "Scanner loop error", e.message ?: "Unknown scanner error", "WARN") }',
              '    }',
              ''
          ]) + '\n'
          s = s[:start] + new_safe + s[end:]
          p.write_text(s)

          p = src/'MainActivity.kt'
          s = p.read_text()
          s = s.replace('screenHeader("Multyfi Intraday", "Daily-adaptive paper intelligence • V3.0")', 'screenHeader("Multyfi Intraday", "Daily-adaptive paper intelligence • V3.0.8")')
          old = ('        statusCard.addView(t(headline, 19f, when { headline.contains("PROMOTED") -> green; headline.contains("PENDING") || headline.contains("COLLECTING") -> amber; else -> purple }, true))\n'
                 '        statusCard.addView(t(last?.reason ?: "The learner needs at least 6 completed replay sessions before it can challenge the Champion.", 14f, text).apply { setPadding(0, dp(8), 0, 0) })\n')
          new = ('        statusCard.addView(t(headline, 19f, when { headline.contains("PROMOTED") -> green; headline.contains("PENDING") || headline.contains("COLLECTING") -> amber; else -> purple }, true))\n'
                 '        val currentEvidenceText = when {\n'
                 '            !upToDate && sessions < 6 -> "Current evidence: $sessions / 6 replay sessions available. The Champion is unchanged until enough current evidence is available and evaluated."\n'
                 '            !upToDate -> "Current evidence: $sessions replay sessions available. Re-evaluation is pending; the previous learning result is historical only."\n'
                 '            last != null -> last.reason\n'
                 '            else -> "No completed learning evaluation yet."\n'
                 '        }\n'
                 '        statusCard.addView(t(currentEvidenceText, 14f, text).apply { setPadding(0, dp(8), 0, 0) })\n')
          if old not in s: raise SystemExit('learning status hook not found')
          s = s.replace(old, new, 1)
          needle = '        sectionTitle("Multyfi candidate access", '
          pos = s.find(needle)
          if pos < 0: raise SystemExit('settings cadence hook not found')
          rate_block = ('        sectionTitle("Market data cadence", "Groww Quote REST is polled adaptively across active candidates. The scanner uses one request at a time, round-robin, capped at 4 quote requests/second and 240/minute. Groww currently documents Live Data limits of 10/second and 300/minute, so this keeps reserve capacity.")\n'
                        '        val cadenceCard = cardBox(16, greenSoft)\n'
                        '        cadenceCard.addView(t("ADAPTIVE • 4 req/s MAX • 240/min MAX", 14f, green, true))\n'
                        '        cadenceCard.addView(t("Approximate refresh per candidate: 0.25s × number of active candidates, plus network latency. Two candidates ≈ 0.5s each; seven ≈ 1.75s each.", 13f, text).apply { setPadding(0, dp(6), 0, 0) })\n'
                        '        addCard(cadenceCard, bottom = 20)\n\n')
          s = s[:pos] + rate_block + s[pos:]
          p.write_text(s)

          p = src/'DiagnosticExporter.kt'
          s = p.read_text().replace('V3.0.7 — FULL DAILY DIAGNOSTIC', 'V3.0.8 — FULL DAILY DIAGNOSTIC').replace('App version: 3.0.7', 'App version: 3.0.8')
          needle = '            appendLine("Risk controls: DYNAMIC PER ENTRY — stop/trail/min-hold are not manually configured")\n'
          if needle in s:
              s = s.replace(needle, needle + '            appendLine("Groww quote polling: adaptive round-robin, max 4 requests/sec, max 240/min")\n            appendLine("Groww documented Live Data limit: 10 requests/sec, 300/min")\n', 1)
          p.write_text(s)
          PY

          grep -q 'versionCode = 308' "$BASE/app/build.gradle.kts"
          grep -q 'versionName = "3.0.8"' "$BASE/app/build.gradle.kts"
          grep -q '250, TimeUnit.MILLISECONDS' "$SRC/MultyfiNotificationService.kt"
          grep -q 'Maximum theoretical quote cadence: 4/sec = 240/min' "$SRC/MultyfiNotificationService.kt"
          grep -q 'Current evidence: \$sessions / 6 replay sessions available' "$SRC/MainActivity.kt"
          grep -q 'ADAPTIVE • 4 req/s MAX • 240/min MAX' "$SRC/MainActivity.kt"
          grep -q 'MULTYFI INTRADAY MOBILE V3.0.8' "$SRC/DiagnosticExporter.kt"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: Multyfi_Intraday_Mobile_V3_0
        run: gradle --no-daemon --console=plain clean assembleRelease

      - name: Restore V3 update signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/multyfi-v3-signing
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10109117099/zip" \
            -o /tmp/multyfi-v3-signing/previous.zip
          unzip -j /tmp/multyfi-v3-signing/previous.zip \
            'Multyfi-Intraday-V3-Update-Key.jks' \
            'SIGNING-PASSWORD.txt' \
            'Multyfi_Intraday_Mobile_V3_0_SIGNED.apk' \
            -d /tmp/multyfi-v3-signing

      - name: Sign and verify V3.0.8 update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UNSIGNED='Multyfi_Intraday_Mobile_V3_0/app/build/outputs/apk/release/app-release-unsigned.apk'
          ALIGNED='out/Multyfi-Intraday-Mobile-V3.0.8-aligned.apk'
          SIGNED='out/Multyfi_Intraday_Mobile_V3_0_8_ADAPTIVE_POLLING_SIGNED_UPDATE.apk'
          KEYSTORE='/tmp/multyfi-v3-signing/Multyfi-Intraday-V3-Update-Key.jks'
          PASS="$(tr -d '\r\n' < /tmp/multyfi-v3-signing/SIGNING-PASSWORD.txt)"
          OLD_APK='/tmp/multyfi-v3-signing/Multyfi_Intraday_Mobile_V3_0_SIGNED.apk'
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$ZIPALIGN" -P 16 -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee out/APK-SIGNATURE-VERIFY.txt
          "$AAPT" dump badging "$SIGNED" | tee out/APK-BADGING.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$SIGNED" | tee out/ZIPALIGN-VERIFY.txt
          unzip -t "$SIGNED" | tee out/ZIP-INTEGRITY.txt
          OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          NEW_CERT="$("$APKSIGNER" verify --print-certs "$SIGNED" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT"
          printf 'Previous signer SHA-256: %s\nNew signer SHA-256: %s\nMATCH: YES\n' "$OLD_CERT" "$NEW_CERT" | tee out/UPDATE-SIGNER-MATCH.txt
          grep -q "package: name='com.multyfi.intraday.mobile'" out/APK-BADGING.txt
          grep -q "versionCode='308'" out/APK-BADGING.txt
          grep -q "versionName='3.0.8'" out/APK-BADGING.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'No errors detected' out/ZIP-INTEGRITY.txt
          sha256sum "$SIGNED" | tee out/SHA256.txt

      - name: Upload verified V3.0.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-V3.0.8-ADAPTIVE-POLLING
          path: |
            out/Multyfi_Intraday_Mobile_V3_0_8_ADAPTIVE_POLLING_SIGNED_UPDATE.apk
            out/APK-SIGNATURE-VERIFY.txt
            out/APK-BADGING.txt
            out/ZIPALIGN-VERIFY.txt
            out/ZIP-INTEGRITY.txt
            out/UPDATE-SIGNER-MATCH.txt
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
