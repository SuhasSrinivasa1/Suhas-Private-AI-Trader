name: Build Multyfi V3.0.9 Feed Resilience

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-v309-feed-resilience:
    if: contains(github.event.pull_request.title, '[BUILD-MULTYFI-V3]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reuse verified V3.0.8 transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-multyfi-v302-usability.yml').read_text().splitlines()
          def extract(step_name, out):
              start = next(i for i,l in enumerate(wf) if l.strip() == f'- name: {step_name}')
              run_i = next(i for i in range(start+1, len(wf)) if wf[i].strip() == 'run: |')
              run_indent = len(wf[run_i]) - len(wf[run_i].lstrip())
              body = []
              for line in wf[run_i+1:]:
                  if line.strip() == '':
                      body.append('')
                      continue
                  indent = len(line) - len(line.lstrip())
                  if indent <= run_indent:
                      break
                  body.append(line[min(len(line), run_indent+2):])
              Path(out).write_text('\n'.join(body) + '\n')
          extract('Reuse verified V3.0.7 transformation', '/tmp/v308_base.sh')
          extract('Apply V3.0.8 adaptive polling and evidence UI', '/tmp/v308_patch.sh')
          PY
          bash /tmp/v308_base.sh
          bash /tmp/v308_patch.sh

      - name: Apply V3.0.9 connectivity guard and LG G7 compatibility polish
        shell: bash
        run: |
          set -euo pipefail
          BASE='Multyfi_Intraday_Mobile_V3_0'
          SRC="$BASE/app/src/main/java/com/multyfi/intraday/mobile"
          python3 - <<'PY'
          from pathlib import Path
          base = Path('Multyfi_Intraday_Mobile_V3_0')
          src = base/'app/src/main/java/com/multyfi/intraday/mobile'

          # Version bump. minSdk stays 26, compatible with LG G7 ThinQ's Android 8+ baseline.
          p = base/'app/build.gradle.kts'
          s = p.read_text().replace('versionCode = 308', 'versionCode = 309').replace('versionName = "3.0.8"', 'versionName = "3.0.9"')
          p.write_text(s)

          # Persist feed-health state so the UI and diagnostics can show DEGRADED/RECOVERED explicitly.
          p = src/'AppRepository.kt'
          s = p.read_text()
          hook = '    fun markFeed() { prefs.edit().putLong("last_feed_ts", System.currentTimeMillis()).apply() }\n'
          if hook not in s: raise SystemExit('AppRepository feed hook not found')
          extra = '''    fun markFeedDegraded(kind: String, detail: String, backoffUntil: Long) {\n        prefs.edit()\n            .putBoolean("feed_degraded", true)\n            .putString("feed_issue_kind", kind)\n            .putString("feed_issue_detail", detail.take(500))\n            .putLong("feed_degraded_ts", System.currentTimeMillis())\n            .putLong("feed_backoff_until", backoffUntil)\n            .apply()\n    }\n    fun markFeedRecovered(entryResumeTs: Long) {\n        prefs.edit()\n            .putBoolean("feed_degraded", false)\n            .putString("feed_issue_kind", "")\n            .putString("feed_issue_detail", "")\n            .putLong("feed_recovered_ts", System.currentTimeMillis())\n            .putLong("feed_backoff_until", 0L)\n            .putLong("feed_entry_resume_ts", entryResumeTs)\n            .apply()\n    }\n    fun feedDegraded(): Boolean = prefs.getBoolean("feed_degraded", false)\n    fun feedIssueKind(): String = prefs.getString("feed_issue_kind", "") ?: ""\n    fun feedIssueDetail(): String = prefs.getString("feed_issue_detail", "") ?: ""\n    fun feedBackoffUntil(): Long = prefs.getLong("feed_backoff_until", 0L)\n    fun feedEntryResumeTs(): Long = prefs.getLong("feed_entry_resume_ts", 0L)\n'''
          s = s.replace(hook, hook + extra, 1)
          p.write_text(s)

          # Replace the polling loop with classified failures, controlled backoff, feed-state transitions,
          # and an explicit new-entry warm-up. Existing paper/live positions still receive successful quotes.
          p = src/'MultyfiNotificationService.kt'
          s = p.read_text()
          hook = '    @Volatile private var quoteCursor = 0\n'
          if hook not in s: raise SystemExit('V3.0.8 quoteCursor hook not found')
          state = '''    @Volatile private var feedFailureStreak = 0\n    @Volatile private var feedSuccessStreak = 0\n    @Volatile private var feedDegraded = false\n    @Volatile private var backoffUntilMs = 0L\n    @Volatile private var entryResumeAfterMs = 0L\n'''
          s = s.replace(hook, hook + state, 1)

          start = s.index('    private fun safePoll() {')
          end = s.index('    private fun throttledLog(', start)
          replacement = r'''    private fun safePoll() {
        runCatching {
            repo.markListenerHeartbeat()
            val nowMs = System.currentTimeMillis()
            if (repo.feedDegraded()) feedDegraded = true
            val persistedBackoff = repo.feedBackoffUntil()
            if (nowMs < maxOf(backoffUntilMs, persistedBackoff)) return

            val validSymbols = catalog.cachedSymbols().ifEmpty {
                refreshCatalogAndSanitize(force = false) ?: return
            }
            if (validSymbols.size < 500) return

            if (MarketClock.shouldForceFlat()) {
                repo.todayCandidates()
                    .filter { it.symbol.uppercase(Locale.US) in validSymbols }
                    .forEach { c ->
                        val flat = PaperEngine.forceFlat(repo, c)
                        LiveTradeEngine.sync(repo, c, flat)
                        if (flat != c) repo.saveCandidate(flat)
                    }
                val n = MarketClock.now()
                if (n.hour >= 15 && n.minute >= 20 && !repo.learningUpToDate()) {
                    val r = ReplayEngine().learn(repo)
                    if (r.promoted) repo.saveConfig(r.championAfter)
                    repo.recordLearning(r)
                }
                return
            }
            if (!MarketClock.isTrackingWindow()) return
            val token = repo.accessToken()
            if (token.isBlank()) return

            val active = repo.todayCandidates()
                .filter { it.status != "SESSION_LOCKED" }
                .filter { it.symbol.uppercase(Locale.US) in validSymbols }
            if (active.isEmpty()) return

            val idx = Math.floorMod(quoteCursor, active.size)
            val c = active[idx]
            quoteCursor = if (quoteCursor == Int.MAX_VALUE) 0 else quoteCursor + 1

            runCatching {
                val q = GrowwClient.quote(token, c.symbol)
                repo.appendTick(c.id, q)
                noteQuoteSuccess()

                val ticks = repo.ticks(c.id).takeLast(180)
                val gateUntil = maxOf(entryResumeAfterMs, repo.feedEntryResumeTs())
                val blockFreshEntry = feedDegraded || repo.feedDegraded() || System.currentTimeMillis() < gateUntil
                val updated = if (blockFreshEntry && c.paperSide == "FLAT") {
                    val f = SignalMath.latest(ticks)
                    c.copy(lastLtp = f.price, lastUpdatedTs = f.ts, score = f.score, rvol = f.rvol, vwapPct = f.vwapPct, trend = f.trend)
                } else {
                    PaperEngine.onQuote(repo, c, ticks)
                }
                LiveTradeEngine.sync(repo, c, updated)
                repo.saveCandidate(updated)
            }.onFailure { e ->
                noteQuoteFailure(c.symbol, e)
            }
        }.onFailure { e -> throttledLog("loop", "Scanner loop error", e.message ?: "Unknown scanner error", "WARN") }
    }

    private fun classifyFeedError(e: Throwable): String {
        val m = (e.message ?: e.javaClass.simpleName).lowercase(Locale.US)
        return when {
            "unable to resolve host" in m || "no address associated" in m || "unknownhost" in m -> "DNS"
            "timeout" in m || "timed out" in m || "sockettimeoutexception" in m -> "TIMEOUT"
            "http 429" in m || ("rate" in m && "limit" in m) -> "RATE LIMIT"
            "http 401" in m || "http 403" in m || "unauthorized" in m || "forbidden" in m -> "AUTH"
            "http 4" in m || "bad request" in m -> "API"
            "connection abort" in m || "failed to connect" in m || "connection reset" in m -> "NETWORK"
            else -> "NETWORK"
        }
    }

    private fun retryDelayMs(kind: String, streak: Int): Long = when (kind) {
        "RATE LIMIT" -> 60_000L
        "AUTH" -> 30_000L
        "DNS" -> when { streak >= 5 -> 20_000L; streak >= 3 -> 10_000L; else -> 5_000L }
        "TIMEOUT" -> when { streak >= 5 -> 15_000L; streak >= 3 -> 7_000L; else -> 3_000L }
        "API" -> 5_000L
        else -> when { streak >= 5 -> 15_000L; streak >= 3 -> 7_000L; else -> 2_000L }
    }

    private fun noteQuoteFailure(symbol: String, e: Throwable) {
        val now = System.currentTimeMillis()
        feedSuccessStreak = 0
        feedFailureStreak += 1
        val kind = classifyFeedError(e)
        val delay = retryDelayMs(kind, feedFailureStreak)
        backoffUntilMs = now + delay
        val detail = e.message ?: "Groww quote failed"

        if (feedFailureStreak >= 2 && !feedDegraded) {
            feedDegraded = true
            repo.markFeedDegraded(kind, detail, backoffUntilMs)
            repo.logActivity(
                "SYSTEM",
                "FEED DEGRADED • $kind",
                "${feedFailureStreak} consecutive Groww quote failures. New entries are paused. Existing positions are still managed whenever fresh quotes arrive. Retry backoff ${delay / 1000}s. Last symbol: $symbol • $detail",
                "WARN"
            )
        } else if (feedDegraded) {
            repo.markFeedDegraded(kind, detail, backoffUntilMs)
            throttledLog(
                "feed_degraded",
                "Feed still degraded • $kind",
                "New entries remain paused; retrying with controlled backoff. Last symbol: $symbol • $detail",
                "WARN"
            )
        }
    }

    private fun noteQuoteSuccess() {
        val wasDegraded = feedDegraded || repo.feedDegraded()
        if (!wasDegraded) {
            feedFailureStreak = 0
            feedSuccessStreak = 0
            return
        }

        feedSuccessStreak += 1
        if (feedSuccessStreak < 3) return

        val now = System.currentTimeMillis()
        feedDegraded = false
        feedFailureStreak = 0
        feedSuccessStreak = 0
        backoffUntilMs = 0L
        entryResumeAfterMs = now + 30_000L
        repo.markFeedRecovered(entryResumeAfterMs)
        repo.logActivity(
            "SYSTEM",
            "FEED RECOVERED",
            "Three consecutive fresh Groww quotes succeeded. Existing positions continue normally; fresh entries wait for a 30-second clean-data warm-up.",
            "INFO"
        )
    }

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # Live UI: distinguish feed degradation, recovery warm-up, and normal post-close staleness.
          p = src/'MainActivity.kt'
          s = p.read_text()
          s = s.replace('screenHeader("Multyfi Intraday", "Daily-adaptive paper intelligence • V3.0.8")', 'screenHeader("Multyfi Intraday", "Daily-adaptive paper intelligence • V3.0.9")')
          old = '        val ready = listener && groww\n'
          new = '        val exchangeOpen = MarketClock.exchangeState() == "OPEN"\n        val feedDegradedNow = exchangeOpen && repo.feedDegraded()\n        val ready = listener && groww && !feedDegradedNow\n'
          if old not in s: raise SystemExit('MainActivity ready hook not found')
          s = s.replace(old, new, 1)
          old = '        titleRow.addView(t(if (ready) "●  SYSTEM READY" else "●  SETUP REQUIRED", 19f, if (ready) green else amber, true), LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))\n'
          new = '        titleRow.addView(t(if (feedDegradedNow) "●  FEED DEGRADED" else if (ready) "●  SYSTEM READY" else "●  SETUP REQUIRED", 19f, if (feedDegradedNow) red else if (ready) green else amber, true), LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))\n'
          if old not in s: raise SystemExit('MainActivity title hook not found')
          s = s.replace(old, new, 1)
          old = '''        val feedAge = if (repo.lastFeedTs() <= 0) "WAITING" else "${((System.currentTimeMillis() - repo.lastFeedTs()) / 1000).coerceAtLeast(0)}s ago"\n        s.addView(statusRow("Market data", feedAge, if (repo.lastFeedTs() > 0 && System.currentTimeMillis() - repo.lastFeedTs() < 30_000) true else null))\n'''
          new = '''        val feedNow = System.currentTimeMillis()\n        val lastFeed = repo.lastFeedTs()\n        val warmupUntil = repo.feedEntryResumeTs()\n        val feedAgeSec = if (lastFeed <= 0L) Long.MAX_VALUE else ((feedNow - lastFeed) / 1000L).coerceAtLeast(0L)\n        val feedLabel = when {\n            !exchangeOpen && lastFeed > 0L -> "SESSION CLOSED • final ${timeOnly(lastFeed)}"\n            repo.feedDegraded() -> "DEGRADED • ${repo.feedIssueKind().ifBlank { "NETWORK" }}"\n            feedNow < warmupUntil -> "RECOVERED • warm-up ${((warmupUntil - feedNow + 999L) / 1000L)}s"\n            lastFeed <= 0L -> "WAITING"\n            else -> "${feedAgeSec}s ago"\n        }\n        val feedOk: Boolean? = when {\n            repo.feedDegraded() -> false\n            !exchangeOpen -> null\n            feedNow < warmupUntil -> null\n            lastFeed > 0L && feedNow - lastFeed < 30_000L -> true\n            else -> null\n        }\n        s.addView(statusRow("Market data", feedLabel, feedOk))\n'''
          if old not in s: raise SystemExit('MainActivity feed row hook not found')
          s = s.replace(old, new, 1)

          # Settings explanation for the connectivity guard.
          hook = '        addCard(cadenceCard, bottom = 20)\n\n'
          if hook not in s: raise SystemExit('MainActivity cadence card hook not found')
          extra = '''        val resilienceCard = cardBox(16, purpleSoft)\n        resilienceCard.addView(t("FEED RESILIENCE — AUTO", 14f, purple, true))\n        resilienceCard.addView(t("DNS failures, timeouts, rate limits and other network failures are classified separately. After repeated failures the app marks FEED DEGRADED, pauses fresh entries, retries with backoff, and requires three fresh quotes plus a 30-second warm-up before new entries resume. Existing positions are still managed whenever fresh quotes arrive.", 13f, text).apply { setPadding(0, dp(6), 0, 0) })\n        addCard(resilienceCard, bottom = 20)\n\n'''
          s = s.replace(hook, hook + extra, 1)
          p.write_text(s)

          # Diagnostic version and feed-health evidence.
          p = src/'DiagnosticExporter.kt'
          s = p.read_text().replace('V3.0.8 — FULL DAILY DIAGNOSTIC', 'V3.0.9 — FULL DAILY DIAGNOSTIC').replace('App version: 3.0.8', 'App version: 3.0.9')
          hook = '            appendLine("Groww documented Live Data limit: 10 requests/sec, 300/min")\n'
          if hook in s:
              extra = ('            appendLine("Feed health: ${if (repo.feedDegraded()) "DEGRADED" else "HEALTHY/RECOVERING"}")\n'
                       '            appendLine("Feed issue kind: ${repo.feedIssueKind().ifBlank { "NONE" }}")\n'
                       '            appendLine("Feed issue detail: ${repo.feedIssueDetail().ifBlank { "NONE" }}")\n'
                       '            appendLine("New-entry warm-up remaining seconds: ${((repo.feedEntryResumeTs() - System.currentTimeMillis()).coerceAtLeast(0L) / 1000L)}")\n')
              s = s.replace(hook, hook + extra, 1)
          p.write_text(s)
          PY

          grep -q 'versionCode = 309' "$BASE/app/build.gradle.kts"
          grep -q 'versionName = "3.0.9"' "$BASE/app/build.gradle.kts"
          grep -q 'minSdk = 26' "$BASE/app/build.gradle.kts"
          grep -q 'FEED DEGRADED' "$SRC/MultyfiNotificationService.kt"
          grep -q 'FEED RECOVERED' "$SRC/MultyfiNotificationService.kt"
          grep -q 'feedFailureStreak >= 2' "$SRC/MultyfiNotificationService.kt"
          grep -q 'entryResumeAfterMs = now + 30_000L' "$SRC/MultyfiNotificationService.kt"
          grep -q 'SESSION CLOSED • final' "$SRC/MainActivity.kt"
          grep -q 'FEED RESILIENCE — AUTO' "$SRC/MainActivity.kt"
          grep -q 'MULTYFI INTRADAY MOBILE V3.0.9' "$SRC/DiagnosticExporter.kt"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: Multyfi_Intraday_Mobile_V3_0
        run: gradle --no-daemon --console=plain clean assembleRelease

      - name: Restore V3 update signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/multyfi-v3-signing
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10109117099/zip" \
            -o /tmp/multyfi-v3-signing/previous.zip
          unzip -j /tmp/multyfi-v3-signing/previous.zip \
            'Multyfi-Intraday-V3-Update-Key.jks' \
            'SIGNING-PASSWORD.txt' \
            'Multyfi_Intraday_Mobile_V3_0_SIGNED.apk' \
            -d /tmp/multyfi-v3-signing

      - name: Sign and verify V3.0.9 update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UNSIGNED='Multyfi_Intraday_Mobile_V3_0/app/build/outputs/apk/release/app-release-unsigned.apk'
          ALIGNED='out/Multyfi-Intraday-Mobile-V3.0.9-aligned.apk'
          SIGNED='out/Multyfi_Intraday_Mobile_V3_0_9_FEED_RESILIENCE_SIGNED_UPDATE.apk'
          KEYSTORE='/tmp/multyfi-v3-signing/Multyfi-Intraday-V3-Update-Key.jks'
          PASS="$(tr -d '\r\n' < /tmp/multyfi-v3-signing/SIGNING-PASSWORD.txt)"
          OLD_APK='/tmp/multyfi-v3-signing/Multyfi_Intraday_Mobile_V3_0_SIGNED.apk'
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$ZIPALIGN" -P 16 -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee out/APK-SIGNATURE-VERIFY.txt
          "$AAPT" dump badging "$SIGNED" | tee out/APK-BADGING.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$SIGNED" | tee out/ZIPALIGN-VERIFY.txt
          unzip -t "$SIGNED" | tee out/ZIP-INTEGRITY.txt
          OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          NEW_CERT="$("$APKSIGNER" verify --print-certs "$SIGNED" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT"
          printf 'Previous signer SHA-256: %s\nNew signer SHA-256: %s\nMATCH: YES\n' "$OLD_CERT" "$NEW_CERT" | tee out/UPDATE-SIGNER-MATCH.txt
          grep -q "package: name='com.multyfi.intraday.mobile'" out/APK-BADGING.txt
          grep -q "versionCode='309'" out/APK-BADGING.txt
          grep -q "versionName='3.0.9'" out/APK-BADGING.txt
          grep -q "sdkVersion:'26'" out/APK-BADGING.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'No errors detected' out/ZIP-INTEGRITY.txt
          sha256sum "$SIGNED" | tee out/SHA256.txt

      - name: Upload verified V3.0.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-V3.0.9-FEED-RESILIENCE
          path: |
            out/Multyfi_Intraday_Mobile_V3_0_9_FEED_RESILIENCE_SIGNED_UPDATE.apk
            out/APK-SIGNATURE-VERIFY.txt
            out/APK-BADGING.txt
            out/ZIPALIGN-VERIFY.txt
            out/ZIP-INTEGRITY.txt
            out/UPDATE-SIGNER-MATCH.txt
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
