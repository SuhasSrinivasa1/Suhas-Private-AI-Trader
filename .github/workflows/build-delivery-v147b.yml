name: Build Delivery Trade Hub v1.4.7 retry

on:
  push:
    branches: [ delivery-v147-holdings-exit-fix-20260915 ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download verified v1.4.6 release
        uses: actions/download-artifact@v4
        with:
          name: delivery-trade-hub-v146
          path: previous-v146
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SuhasSrinivasa1/Suhas-Private-AI-Trader
          run-id: 34570642049
      - name: Reconstruct v1.4.7 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh-delivery-buy
          unzip -q previous-v146/delivery-trade-hub-source-v1.4.6.zip -d fresh-delivery-buy
          cd fresh-delivery-buy
          python3 ../patch-v147/apply_v147.py
          python3 scripts/validate_contract.py
          grep -q "versionName '1.4.7'" app/build.gradle
          grep -q '/v1/holdings/user' app/src/main/java/com/suhas/multyfideliverybuy/GrowwClient.java
          grep -q 't1_quantity' app/src/main/java/com/suhas/multyfideliverybuy/GrowwClient.java
          grep -q 'UNIVEST EXIT RECONCILIATION PENDING' app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate v1.4.7 contract
        working-directory: fresh-delivery-buy
        run: python3 scripts/validate_contract.py
      - name: Unit tests
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:testReleaseUnitTest
      - name: Restore v1.4.x signing identity
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-v146/Delivery-Trade-Hub-SIGNING-BACKUP.zip -d /tmp/v14-signing
          PASS="$(sed -n 's/^Store password: //p' /tmp/v14-signing/SIGNING-BACKUP.txt | head -n1)"
          test -n "$PASS"
          echo "::add-mask::$PASS"
          cp /tmp/v14-signing/delivery-trade-hub-release.p12 fresh-delivery-buy/delivery-trade-hub-release.p12
          cp /tmp/v14-signing/SIGNING-BACKUP.txt fresh-delivery-buy/SIGNING-BACKUP.txt
          echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/fresh-delivery-buy/delivery-trade-hub-release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=deliverybuy" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signer and package
        working-directory: fresh-delivery-buy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/Delivery-Trade-Hub-v1.4.7.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/Delivery-Trade-Hub-v1.4.7.apk | tee output/APK-SIGNATURE-VERIFY.txt
          sha256sum output/Delivery-Trade-Hub-v1.4.7.apk | tee output/APK-SHA256.txt
          OLD_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' ../previous-v146/APK-SIGNATURE-VERIFY.txt | sed 's/.*digest: //')"
          NEW_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' output/APK-SIGNATURE-VERIFY.txt | sed 's/.*digest: //')"
          test -n "$OLD_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          echo "SAME SIGNER PASS: $NEW_CERT" | tee output/SIGNER-COMPATIBILITY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/Delivery-Trade-Hub-v1.4.7.apk | head -n 3 | tee output/APK-PACKAGE.txt
          grep -q "name='com.suhas.multyfideliverybuy'" output/APK-PACKAGE.txt
          grep -q "versionCode='147'" output/APK-PACKAGE.txt
          grep -q "versionName='1.4.7'" output/APK-PACKAGE.txt
          python3 scripts/validate_contract.py | tee output/CONTRACT-VALIDATION.txt
      - name: Package release
        working-directory: fresh-delivery-buy
        shell: bash
        run: |
          set -euo pipefail
          cp ../previous-v146/Delivery-Trade-Hub-SIGNING-BACKUP.zip output/Delivery-Trade-Hub-SIGNING-BACKUP.zip
          cp README.md output/README-v1.4.7.md
          zip -qr output/delivery-trade-hub-source-v1.4.7.zip . -x '.gradle/*' 'app/build/*' 'output/*' 'delivery-trade-hub-release.p12' 'SIGNING-BACKUP.txt'
          echo "Delivery Trade Hub v1.4.7 - holdings/T1 exit reconciliation fix" > output/INSTALL-v1.4.7.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: delivery-trade-hub-v147-retry
          path: fresh-delivery-buy/output/*
          if-no-files-found: error
          retention-days: 30
