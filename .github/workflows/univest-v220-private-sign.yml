name: Univest AutoTrade v2.2.0 Private Signing Build (archived)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Archived workflow notice
        run: |
          echo "The duplicate v2.2.0 PR signing workflow is archived."
          echo "It no longer runs on every repository pull request."
