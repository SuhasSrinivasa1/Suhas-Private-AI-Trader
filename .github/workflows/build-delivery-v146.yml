name: Build Delivery Trade Hub v1.4.6

on:
  push:
    branches: [ delivery-v146-be-series-fix-20260911 ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified v1.4.5 release
        uses: actions/download-artifact@v4
        with:
          name: delivery-trade-hub-v145
          path: previous-v145
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SuhasSrinivasa1/Suhas-Private-AI-Trader
          run-id: 34560821004

      - name: Reconstruct v1.4.6 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh-delivery-buy
          unzip -q previous-v145/delivery-trade-hub-source-v1.4.5.zip -d fresh-delivery-buy
          cd fresh-delivery-buy
          python3 ../patch-v146/apply_v146.py
          python3 scripts/validate_contract.py
          grep -q "versionName '1.4.6'" app/build.gradle
          grep -q 'PROTECTIVE_STOP_DROP = 0.20' app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java
          grep -q '{0.02, 0.04, 0.06, 0.08}' app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java
          grep -q 'symbol.endsWith("-BE")' app/src/main/java/com/suhas/multyfideliverybuy/UnivestParser.java
          grep -q '!"BE".equalsIgnoreCase(series)' app/src/main/java/com/suhas/multyfideliverybuy/InstrumentRepository.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate v1.4.6 contract
        working-directory: fresh-delivery-buy
        run: python3 scripts/validate_contract.py

      - name: Unit tests
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:testReleaseUnitTest

      - name: Restore v1.4.x signing identity
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-v145/Delivery-Trade-Hub-SIGNING-BACKUP.zip -d /tmp/v14-signing
          PASS="$(sed -n 's/^Store password: //p' /tmp/v14-signing/SIGNING-BACKUP.txt | head -n1)"
          test -n "$PASS"
          echo "::add-mask::$PASS"
          cp /tmp/v14-signing/delivery-trade-hub-release.p12 fresh-delivery-buy/delivery-trade-hub-release.p12
          cp /tmp/v14-signing/SIGNING-BACKUP.txt fresh-delivery-buy/SIGNING-BACKUP.txt
          echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/fresh-delivery-buy/delivery-trade-hub-release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=deliverybuy" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signer and package
        working-directory: fresh-delivery-buy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/Delivery-Trade-Hub-v1.4.6.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/Delivery-Trade-Hub-v1.4.6.apk | tee output/APK-SIGNATURE-VERIFY.txt
          sha256sum output/Delivery-Trade-Hub-v1.4.6.apk | tee output/APK-SHA256.txt
          OLD_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' ../previous-v145/APK-SIGNATURE-VERIFY.txt | sed 's/.*digest: //')"
          NEW_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' output/APK-SIGNATURE-VERIFY.txt | sed 's/.*digest: //')"
          test -n "$OLD_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          echo "SAME SIGNER PASS: $NEW_CERT" | tee output/SIGNER-COMPATIBILITY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/Delivery-Trade-Hub-v1.4.6.apk | head -n 3 | tee output/APK-PACKAGE.txt
          grep -q "name='com.suhas.multyfideliverybuy'" output/APK-PACKAGE.txt
          grep -q "versionCode='146'" output/APK-PACKAGE.txt
          grep -q "versionName='1.4.6'" output/APK-PACKAGE.txt
          python3 scripts/validate_contract.py | tee output/CONTRACT-VALIDATION.txt

      - name: Package release
        working-directory: fresh-delivery-buy
        shell: bash
        run: |
          set -euo pipefail
          cp ../previous-v145/Delivery-Trade-Hub-SIGNING-BACKUP.zip output/Delivery-Trade-Hub-SIGNING-BACKUP.zip
          cp README.md output/README-v1.4.6.md
          zip -qr output/delivery-trade-hub-source-v1.4.6.zip . \
            -x '.gradle/*' 'app/build/*' 'output/*' 'delivery-trade-hub-release.p12' 'SIGNING-BACKUP.txt'
          {
            echo "Delivery Trade Hub v1.4.6"
            echo "LG G7 ThinQ compatible: minSdk remains 26; no native ABI dependency was added."
            echo "Fix: Univest symbols carrying the NSE -BE suffix, such as HFCL-BE, are normalized to the Groww/NSE trading symbol before state reservation and order execution."
            echo "Groww official NSE CASH equity filter now permits both EQ and BE series while continuing to reject F&O/options/futures/commodities."
            echo "Fast BUY and dedicated fast EXIT paths are unchanged."
            echo "Univest 1-3 month filter, CNC delivery-only product, four ₹5,000 averages at -2/-4/-6/-8%, ₹2,500 net-profit capture and -20% broker-hosted protective GTT remain unchanged."
          } > output/INSTALL-v1.4.6.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: delivery-trade-hub-v146
          path: fresh-delivery-buy/output/*
          if-no-files-found: error
          retention-days: 30
