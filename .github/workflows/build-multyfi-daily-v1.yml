name: Build Multyfi Daily Learner V1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-multyfi-v1:
    if: contains(github.event.pull_request.title, '[BUILD-MULTYFI-V1]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          wc -c multyfi_daily_v1_source.b64
          base64 -d multyfi_daily_v1_source.b64 > /tmp/multyfi_daily_v1_source.tar.xz
          sha256sum /tmp/multyfi_daily_v1_source.tar.xz
          xz -t /tmp/multyfi_daily_v1_source.tar.xz
          tar -xJf /tmp/multyfi_daily_v1_source.tar.xz
          test -d Multyfi_DailyLearner_V1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: Multyfi_DailyLearner_V1
        run: gradle --no-daemon --console=plain clean assembleRelease

      - name: Align, sign, and verify APK
        working-directory: Multyfi_DailyLearner_V1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UNSIGNED='app/build/outputs/apk/release/app-release-unsigned.apk'
          ALIGNED='out/Multyfi-Daily-Learner-V1-aligned.apk'
          SIGNED='out/Multyfi-Daily-Learner-V1-SIGNED.apk'
          test -s "$UNSIGNED"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$ZIPALIGN" -P 16 -f -v 4 "$UNSIGNED" "$ALIGNED"
          keytool -genkeypair -v -keystore /tmp/multyfi-v1.jks -storepass changeit -keypass changeit -alias multyfi-v1 -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=Multyfi Daily Learner V1, OU=Private Build, O=Multyfi, L=Bengaluru, ST=Karnataka, C=IN'
          "$APKSIGNER" sign --ks /tmp/multyfi-v1.jks --ks-pass pass:changeit --key-pass pass:changeit --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee out/APK-SIGNATURE-VERIFY.txt
          "$AAPT" dump badging "$SIGNED" | tee out/APK-BADGING.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$SIGNED" | tee out/ZIPALIGN-VERIFY.txt
          unzip -t "$SIGNED" | tee out/ZIP-INTEGRITY.txt
          grep -q "package: name='com.multyfi.dailylearner'" out/APK-BADGING.txt
          grep -q "application-label:'Multyfi Daily Learner'" out/APK-BADGING.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'Verification successful' out/ZIPALIGN-VERIFY.txt
          grep -q 'No errors detected' out/ZIP-INTEGRITY.txt
          sha256sum "$SIGNED" | tee out/SHA256.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-Daily-Learner-V1-VERIFIED
          path: |
            Multyfi_DailyLearner_V1/out/Multyfi-Daily-Learner-V1-SIGNED.apk
            Multyfi_DailyLearner_V1/out/APK-SIGNATURE-VERIFY.txt
            Multyfi_DailyLearner_V1/out/APK-BADGING.txt
            Multyfi_DailyLearner_V1/out/ZIPALIGN-VERIFY.txt
            Multyfi_DailyLearner_V1/out/ZIP-INTEGRITY.txt
            Multyfi_DailyLearner_V1/out/SHA256.txt
          if-no-files-found: error
          retention-days: 7
