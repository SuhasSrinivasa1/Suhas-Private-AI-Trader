name: Build Multyfi Intraday Mobile V3

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-multyfi-v3:
    if: contains(github.event.pull_request.title, '[BUILD-MULTYFI-V3]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/MainActivity.kt
          test -f Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/MultyfiNotificationService.kt
          test -f Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/ReplayEngine.kt
          grep -q 'applicationId = "com.multyfi.intraday.mobile"' Multyfi_Intraday_Mobile_V3_0/app/build.gradle.kts
          grep -q 'versionCode = 301' Multyfi_Intraday_Mobile_V3_0/app/build.gradle.kts
          grep -q 'versionName = "3.0.1"' Multyfi_Intraday_Mobile_V3_0/app/build.gradle.kts
          grep -q 'generateAccessTokenWithApproval' Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/GrowwClient.kt
          grep -q 'generateAccessTokenWithTotp' Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/GrowwClient.kt
          grep -q 'apiSecret' Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/AppRepository.kt
          grep -q 'Download Full Daily Diagnostic' Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/MainActivity.kt
          grep -q 'NO BROKER ORDERS' Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/DiagnosticExporter.kt

      - name: Apply V3.0.1 Groww authentication UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/MainActivity.kt')
          s = p.read_text()

          s = s.replace('        setTextColor(text)\n', '        setTextColor(this@MainActivity.text)\n', 1)
          s = s.replace('        singleLine = true\n', '        setSingleLine(true)\n', 1)

          s = s.replace(
              '        s.addView(statusRow("Groww API", if (groww) "LIVE" else if (repo.accessToken().isBlank()) "NOT CONFIGURED" else "VALIDATION REQUIRED", if (groww) true else false))\n',
              '''        s.addView(statusRow("Groww API", when {\n            groww -> "LIVE"\n            repo.accessToken().isNotBlank() -> "VALIDATION REQUIRED"\n            repo.growwCredentialsConfigured() -> "CONNECT REQUIRED"\n            else -> "NOT CONFIGURED"\n        }, if (groww) true else false))\n'''
          )

          start = s.index('        sectionTitle("Groww API",')
          end = s.index('        sectionTitle("Static IP",', start)
          new_settings = '''        sectionTitle(\n            "Groww API",\n            "Enter the two persistent Groww credentials you received. Use Key + Secret for Groww's approval flow, or TOTP for a TOTP token + TOTP secret. The app creates the temporary access token itself — no 6-digit code needs to be typed."\n        )\n        val apiKey = editField(\n            if (repo.apiKey().isBlank()) "API Key / TOTP Token" else "Credential 1 configured — paste only to replace",\n            password = true\n        )\n        val apiSecret = editField(\n            if (repo.apiSecret().isBlank()) "API Secret / TOTP Secret" else "Credential 2 configured — paste only to replace",\n            password = true\n        )\n        addCard(apiKey, bottom = 8)\n        addCard(apiSecret, bottom = 10)\n\n        val authHint = cardBox(14, purpleSoft)\n        authHint.addView(t("Which button should I use?", 14f, purple, true))\n        authHint.addView(t("API Key + API Secret → tap Key + Secret.  TOTP Token + TOTP Secret / QR secret → tap TOTP.  Groww may still require its own daily approval for the approval-based flow.", 12f, text).apply { setPadding(0, dp(5), 0, 0) })\n        addCard(authHint, bottom = 10)\n\n        val growwButtons = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }\n        growwButtons.addView(\n            secondaryButton("Connect • Key + Secret") {\n                connectGrowwAsync(apiKey.text.toString(), apiSecret.text.toString(), "APPROVAL")\n            },\n            LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)\n        )\n        growwButtons.addView(\n            primaryButton("Connect • TOTP") {\n                connectGrowwAsync(apiKey.text.toString(), apiSecret.text.toString(), "TOTP")\n            },\n            LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { leftMargin = dp(8) }\n        )\n        content.addView(growwButtons)\n        content.addView(spacer(12))\n\n        val token = editField(\n            if (repo.accessToken().isBlank()) "Optional existing Access Token" else "Access Token configured — paste only to replace",\n            password = true\n        )\n        addCard(token, bottom = 8)\n        addCard(secondaryButton("Validate Existing Access Token") {\n            val entered = token.text.toString().trim()\n            if (entered.isNotBlank()) repo.saveAccessToken(entered)\n            validateGrowwAsync()\n        }, bottom = 20)\n\n'''
          s = s[:start] + new_settings + s[end:]

          s = s.replace(
              '''            if (token.text.toString().trim().isNotBlank()) repo.saveAccessToken(token.text.toString())\n            if (apiKey.text.toString().trim().isNotBlank()) repo.saveApiKey(apiKey.text.toString())\n            repo.saveWhitelistIp(ip.text.toString())\n''',
              '''            if (token.text.toString().trim().isNotBlank()) repo.saveAccessToken(token.text.toString())\n            if (apiKey.text.toString().trim().isNotBlank()) repo.saveApiKey(apiKey.text.toString())\n            if (apiSecret.text.toString().trim().isNotBlank()) repo.saveApiSecret(apiSecret.text.toString())\n            repo.saveWhitelistIp(ip.text.toString())\n'''
          )

          ms = s.index('    private fun generateTokenAsync(')
          me = s.index('    private fun detectIpAsync()', ms)
          connect_method = '''    private fun connectGrowwAsync(keyEntered: String, secretEntered: String, mode: String) {\n        if (keyEntered.isNotBlank()) repo.saveApiKey(keyEntered)\n        if (secretEntered.isNotBlank()) repo.saveApiSecret(secretEntered)\n\n        val key = repo.apiKey()\n        val secret = repo.apiSecret()\n        if (key.isBlank() || secret.isBlank()) {\n            toast("Enter both Groww credential values first")\n            return\n        }\n\n        val isTotp = mode.equals("TOTP", true)\n        toast(if (isTotp) "Generating Groww token with TOTP…" else "Generating Groww token with Key + Secret…")\n        worker.execute {\n            runCatching {\n                if (isTotp) GrowwClient.generateAccessTokenWithTotp(key, secret)\n                else GrowwClient.generateAccessTokenWithApproval(key, secret)\n            }.onSuccess { access ->\n                repo.saveAccessToken(access)\n                val ok = GrowwClient.validateAccessToken(access)\n                if (ok) {\n                    repo.markGrowwValidated()\n                    repo.logActivity(\n                        "SYSTEM",\n                        "Groww API connected",\n                        if (isTotp) "Access token generated from TOTP credentials and user profile validation succeeded."\n                        else "Access token generated from API key + secret approval flow and user profile validation succeeded."\n                    )\n                } else {\n                    repo.clearGrowwValidation()\n                }\n                runOnUiThread {\n                    toast(if (ok) "Groww connected and validated" else "Token generated; validation failed")\n                    showSettings()\n                }\n            }.onFailure { e ->\n                repo.clearGrowwValidation()\n                repo.logActivity("SYSTEM", "Groww authentication failed", e.message ?: "Groww authentication failed", "WARN")\n                runOnUiThread {\n                    val prefix = if (isTotp) "TOTP connection failed" else "Key + Secret connection failed"\n                    val suffix = if (isTotp) " — check the TOTP token and TOTP secret" else " — complete Groww's daily approval, then retry"\n                    toast("$prefix$suffix")\n                }\n            }\n        }\n    }\n\n'''
          s = s[:ms] + connect_method + s[me:]
          s = s.replace('repo.logActivity("SYSTEM", "Groww API validated", "Live quote authentication succeeded.")', 'repo.logActivity("SYSTEM", "Groww API validated", "Groww user profile authentication succeeded.")')
          s = s.replace('repo.logActivity("SYSTEM", "Groww validation failed", "The access token could not fetch a live quote.", "WARN")', 'repo.logActivity("SYSTEM", "Groww validation failed", "The access token could not validate the Groww user profile.", "WARN")')
          p.write_text(s)
          PY
          grep -q 'Connect • Key + Secret' Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/MainActivity.kt
          grep -q 'Connect • TOTP' Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/MainActivity.kt
          grep -q 'apiSecret' Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/MainActivity.kt
          ! grep -q 'Current 6-digit TOTP' Multyfi_Intraday_Mobile_V3_0/app/src/main/java/com/multyfi/intraday/mobile/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: Multyfi_Intraday_Mobile_V3_0
        run: gradle --no-daemon --console=plain clean assembleRelease

      - name: Align sign and verify APK
        working-directory: Multyfi_Intraday_Mobile_V3_0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UNSIGNED='app/build/outputs/apk/release/app-release-unsigned.apk'
          ALIGNED='out/Multyfi-Intraday-Mobile-V3.0.1-aligned.apk'
          SIGNED='out/Multyfi_Intraday_Mobile_V3_0_1_SIGNED.apk'
          KEYSTORE='out/Multyfi-Intraday-V3-Update-Key.jks'
          PASS="$(openssl rand -hex 16)"
          test -s "$UNSIGNED"
          cp "$UNSIGNED" out/Multyfi_Intraday_Mobile_V3_0_1_UNSIGNED.apk
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$ZIPALIGN" -P 16 -f -v 4 "$UNSIGNED" "$ALIGNED"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias multyfi-v3 -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=Multyfi Intraday Mobile V3, OU=Private Build, O=Multyfi, L=Bengaluru, ST=Karnataka, C=IN'
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee out/APK-SIGNATURE-VERIFY.txt
          "$AAPT" dump badging "$SIGNED" | tee out/APK-BADGING.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$SIGNED" | tee out/ZIPALIGN-VERIFY.txt
          unzip -t "$SIGNED" | tee out/ZIP-INTEGRITY.txt
          grep -q "package: name='com.multyfi.intraday.mobile'" out/APK-BADGING.txt
          grep -q "versionCode='301'" out/APK-BADGING.txt
          grep -q "versionName='3.0.1'" out/APK-BADGING.txt
          grep -q "application-label:'Multyfi Intraday'" out/APK-BADGING.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'Verification successful' out/ZIPALIGN-VERIFY.txt
          grep -q 'No errors detected' out/ZIP-INTEGRITY.txt
          sha256sum "$SIGNED" | tee out/SHA256.txt
          printf '%s\n' "$PASS" > out/SIGNING-PASSWORD.txt

      - name: Upload verified V3.0.1 package
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-Intraday-Mobile-V3.0.1-VERIFIED
          path: |
            Multyfi_Intraday_Mobile_V3_0/out/Multyfi_Intraday_Mobile_V3_0_1_SIGNED.apk
            Multyfi_Intraday_Mobile_V3_0/out/Multyfi_Intraday_Mobile_V3_0_1_UNSIGNED.apk
            Multyfi_Intraday_Mobile_V3_0/out/APK-SIGNATURE-VERIFY.txt
            Multyfi_Intraday_Mobile_V3_0/out/APK-BADGING.txt
            Multyfi_Intraday_Mobile_V3_0/out/ZIPALIGN-VERIFY.txt
            Multyfi_Intraday_Mobile_V3_0/out/ZIP-INTEGRITY.txt
            Multyfi_Intraday_Mobile_V3_0/out/SHA256.txt
            Multyfi_Intraday_Mobile_V3_0/out/Multyfi-Intraday-V3-Update-Key.jks
            Multyfi_Intraday_Mobile_V3_0/out/SIGNING-PASSWORD.txt
          if-no-files-found: error
          retention-days: 30
