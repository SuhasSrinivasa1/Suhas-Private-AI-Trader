name: Multify Trader Pro v4.1.2 Raw TOTP Body

on:
  pull_request:
    branches:
      - main
    paths:
      - 'multify-final-20261006/**'
      - '.github/workflows/multify-final-20261006.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p multify-final-20261006/work
          cat multify-final-20261006/parts/source.part* > multify-final-20261006/work/source.tar.gz.b64
          test "$(sha256sum multify-final-20261006/work/source.tar.gz.b64 | awk '{print $1}')" = "b966e6962e93de1931a18b63b4058d23ccb55badd7231c9b8eb63ba39b59cd07"
          base64 -d multify-final-20261006/work/source.tar.gz.b64 > multify-final-20261006/work/source.tar.gz
          test "$(sha256sum multify-final-20261006/work/source.tar.gz | awk '{print $1}')" = "1b875f28294ddc0b64c8342be929029debce7c759e5d4b4fadb97a358f51e0df"
          tar -xzf multify-final-20261006/work/source.tar.gz -C multify-final-20261006/work
          test -f multify-final-20261006/work/android/app/build.gradle.kts

      - name: Apply v4.1.2 raw TOTP request fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("multify-final-20261006/work/android")

          p = root / "app/build.gradle.kts"
          s = p.read_text()
          assert 'versionCode = 410' in s
          assert 'versionName = "4.1.0-final-learning30"' in s
          s = s.replace('versionCode = 410', 'versionCode = 412')
          s = s.replace('versionName = "4.1.0-final-learning30"', 'versionName = "4.1.2-totp-raw-body"')
          p.write_text(s)

          p = root / "app/proguard-rules.pro"
          s = p.read_text()
          keep = "\n# Keep Groww network DTOs stable under release R8/minification.\n-keep class com.multify.traderpro.data.network.** { *; }\n"
          if "com.multify.traderpro.data.network.**" not in s:
              s += keep
          p.write_text(s)

          p = root / "app/src/main/java/com/multify/traderpro/data/network/GrowwModels.kt"
          s = p.read_text()
          s = s.replace(
              '    val totp: String? = null,\n    val checksum: String? = null,\n    val timestamp: String? = null',
              '    @SerializedName("totp") val totp: String? = null,\n'
              '    @SerializedName("checksum") val checksum: String? = null,\n'
              '    @SerializedName("timestamp") val timestamp: String? = null'
          )
          s = s.replace(
              'data class TokenResponse(\n    val token: String? = null,',
              'data class TokenResponse(\n    @SerializedName("token") val token: String? = null,'
          )
          s = s.replace('    val expiry: String? = null,', '    @SerializedName("expiry") val expiry: String? = null,')
          s = s.replace(
              '    val status: String? = null,\n    val error: ApiError? = null',
              '    @SerializedName("status") val status: String? = null,\n'
              '    @SerializedName("error") val error: ApiError? = null'
          )
          s = s.replace(
              'data class ApiError(val code: String? = null, val message: String? = null)',
              'data class ApiError(\n'
              '    @SerializedName("code") val code: String? = null,\n'
              '    @SerializedName("message") val message: String? = null\n'
              ')'
          )
          p.write_text(s)

          p = root / "app/src/main/java/com/multify/traderpro/data/network/GrowwApi.kt"
          s = p.read_text()
          if 'import okhttp3.RequestBody' not in s:
              s = s.replace('package com.multify.traderpro.data.network\n\n', 'package com.multify.traderpro.data.network\n\nimport okhttp3.RequestBody\n')
          old = '''    suspend fun createAccessToken(
                  @Header("Authorization") authorization: String,
                  @Body request: TokenRequest
              ): TokenResponse'''
          new = '''    suspend fun createAccessToken(
                  @Header("Authorization") authorization: String,
                  @Body request: RequestBody
              ): TokenResponse'''
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)

          p = root / "app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt"
          s = p.read_text()
          s = s.replace('import com.multify.traderpro.data.network.TokenRequest\n', '')
          anchor = 'import kotlinx.coroutines.flow.first\n'
          additions = (
              'import okhttp3.MediaType.Companion.toMediaType\n'
              'import okhttp3.RequestBody.Companion.toRequestBody\n'
              'import org.json.JSONObject\n'
          )
          if 'import org.json.JSONObject' not in s:
              assert anchor in s
              s = s.replace(anchor, anchor + additions)

          old = '''        val totp = TotpGenerator.generate(totpSecret)
              val tokenResponse = try {
                  apiFactory.groww.createAccessToken(
                      authorization = "Bearer $apiKey",
                      request = TokenRequest(keyType = "totp", totp = totp)
                  )
              } catch (e: HttpException) {
                  error(growwAuthError(e))
              }'''
          new = '''        val totp = TotpGenerator.generate(totpSecret)
              require(totp.length == 6 && totp.all { it.isDigit() }) {
                  "Local Groww TOTP generation failed validation"
              }
              val requestJson = JSONObject()
                  .put("key_type", "totp")
                  .put("totp", totp)
                  .toString()
              val requestBody = requestJson.toRequestBody("application/json; charset=utf-8".toMediaType())
              auditLogger.log(
                  "AUTH",
                  "TOTP_REQUEST_READY",
                  mapOf(
                      "totp_generated" to true,
                      "totp_length" to totp.length,
                      "totp_digits_only" to totp.all { it.isDigit() },
                      "totp_token_length" to apiKey.length,
                      "request_keys" to "key_type,totp"
                  )
              )
              val tokenResponse = try {
                  apiFactory.groww.createAccessToken(
                      authorization = "Bearer $apiKey",
                      request = requestBody
                  )
              } catch (e: HttpException) {
                  error(growwAuthError(e) + " Local check: generated a 6-digit TOTP and sent raw JSON keys key_type,totp.")
              }'''
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)
          PY

          grep -q 'versionCode = 412' multify-final-20261006/work/android/app/build.gradle.kts
          grep -q 'versionName = "4.1.2-totp-raw-body"' multify-final-20261006/work/android/app/build.gradle.kts
          grep -Fq 'request = requestBody' multify-final-20261006/work/android/app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -Fq '.put("totp", totp)' multify-final-20261006/work/android/app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -Fq '@Body request: RequestBody' multify-final-20261006/work/android/app/src/main/java/com/multify/traderpro/data/network/GrowwApi.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        working-directory: multify-final-20261006/work/android
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        working-directory: multify-final-20261006/work/android
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify release mapping and raw auth path
        shell: bash
        run: |
          set -euo pipefail
          MAP=multify-final-20261006/work/android/app/build/outputs/mapping/release/mapping.txt
          test -f "$MAP"
          grep -Fq 'com.multify.traderpro.data.network.TokenResponse -> com.multify.traderpro.data.network.TokenResponse:' "$MAP"

      - name: Stage build outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf multify-final-20261006/output
          mkdir -p multify-final-20261006/output
          cp multify-final-20261006/work/android/app/build/outputs/apk/release/*.apk multify-final-20261006/output/MultifyTraderPro-v4.1.2-TOTP-RAW-unsigned.apk
          sha256sum multify-final-20261006/output/MultifyTraderPro-v4.1.2-TOTP-RAW-unsigned.apk > multify-final-20261006/output/SHA256-UNSIGNED.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultifyTraderPro-v4.1.2-TOTP-RAW-build
          path: multify-final-20261006/output/*
          if-no-files-found: error
          retention-days: 7
