name: Build Delivery Trade Hub v1.4.3

on:
  push:
    branches: [ delivery-v143-avg2-exitreconcile-20260910 ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified v1.4.2 release
        uses: actions/download-artifact@v4
        with:
          name: delivery-trade-hub-v142
          path: previous-v142
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SuhasSrinivasa1/Suhas-Private-AI-Trader
          run-id: 34453849461

      - name: Reconstruct v1.4.3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh-delivery-buy
          unzip -q previous-v142/delivery-trade-hub-source-v1.4.2.zip -d fresh-delivery-buy
          cd fresh-delivery-buy
          python3 ../patch-v143/apply_v143.py
          python3 scripts/validate_contract.py
          grep -q "versionName '1.4.3'" app/build.gradle
          grep -q '{0.02, 0.04, 0.06}' app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java
          grep -q 'cancelOpenCncSellOrdersForSymbol' app/src/main/java/com/suhas/multyfideliverybuy/GrowwClient.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate v1.4.3 contract
        working-directory: fresh-delivery-buy
        run: python3 scripts/validate_contract.py

      - name: Unit tests
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:testReleaseUnitTest

      - name: Restore v1.4.x signing identity
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-v142/Delivery-Trade-Hub-SIGNING-BACKUP.zip -d /tmp/v14-signing
          PASS="$(sed -n 's/^Store password: //p' /tmp/v14-signing/SIGNING-BACKUP.txt | head -n1)"
          test -n "$PASS"
          echo "::add-mask::$PASS"
          cp /tmp/v14-signing/delivery-trade-hub-release.p12 fresh-delivery-buy/delivery-trade-hub-release.p12
          cp /tmp/v14-signing/SIGNING-BACKUP.txt fresh-delivery-buy/SIGNING-BACKUP.txt
          echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/fresh-delivery-buy/delivery-trade-hub-release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=deliverybuy" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: fresh-delivery-buy
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signer and package
        working-directory: fresh-delivery-buy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/Delivery-Trade-Hub-v1.4.3.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/Delivery-Trade-Hub-v1.4.3.apk | tee output/APK-SIGNATURE-VERIFY.txt
          sha256sum output/Delivery-Trade-Hub-v1.4.3.apk | tee output/APK-SHA256.txt
          OLD_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' ../previous-v142/APK-SIGNATURE-VERIFY.txt | sed 's/.*digest: //')"
          NEW_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' output/APK-SIGNATURE-VERIFY.txt | sed 's/.*digest: //')"
          test -n "$OLD_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          echo "SAME SIGNER PASS: $NEW_CERT" | tee output/SIGNER-COMPATIBILITY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/Delivery-Trade-Hub-v1.4.3.apk | head -n 3 | tee output/APK-PACKAGE.txt
          grep -q "name='com.suhas.multyfideliverybuy'" output/APK-PACKAGE.txt
          grep -q "versionCode='143'" output/APK-PACKAGE.txt
          grep -q "versionName='1.4.3'" output/APK-PACKAGE.txt
          python3 scripts/validate_contract.py | tee output/CONTRACT-VALIDATION.txt

      - name: Package release
        working-directory: fresh-delivery-buy
        shell: bash
        run: |
          set -euo pipefail
          cp ../previous-v142/Delivery-Trade-Hub-SIGNING-BACKUP.zip output/Delivery-Trade-Hub-SIGNING-BACKUP.zip
          cp README.md output/README-v1.4.3.md
          zip -qr output/delivery-trade-hub-source-v1.4.3.zip . \
            -x '.gradle/*' 'app/build/*' 'output/*' 'delivery-trade-hub-release.p12' 'SIGNING-BACKUP.txt'
          {
            echo "Delivery Trade Hub v1.4.3"
            echo "Install directly over v1.4.2; same package and signing certificate are preserved."
            echo "Univest downward averaging is now fixed at ₹5,000 at -2%, -4% and -6% from the original executed entry anchor, one GTT at a time."
            echo "Before an automated Univest CNC MARKET SELL, the app clears app-owned averaging/re-entry GTTs and conflicting regular open/pending CASH/CNC SELL orders for the same symbol."
            echo "It re-lists orders after cancellation and will not send the market sell if a conflicting sell remains unresolved."
            echo "It then reconciles the broker CNC position and sells only the remaining tracked Univest quantity, preventing the prior not-enough-shares failure caused by a manual delivery sell order."
            echo "Univest remains 1-3 month equity entries only and always CASH/CNC DELIVERY. Recommendation-cycle dedupe remains unchanged."
            echo "All Multyfi and manual-trade behavior remains unchanged from v1.4.2."
          } > output/INSTALL-v1.4.3.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: delivery-trade-hub-v143
          path: fresh-delivery-buy/output/*
          if-no-files-found: error
          retention-days: 30
