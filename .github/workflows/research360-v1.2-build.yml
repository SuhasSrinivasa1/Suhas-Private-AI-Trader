name: Research360 v1.2 APK Build

on:
  push:
    branches:
      - research360-build-v1.2.0
    paths:
      - 'research360-build/source/**'
      - '.github/workflows/research360-v1.2-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Research360 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r360
          mkdir -p /tmp/r360
          cat research360-build/source/part* > /tmp/r360-src.b64
          base64 -d /tmp/r360-src.b64 > /tmp/r360-src.tar.gz
          tar -xzf /tmp/r360-src.tar.gz -C /tmp/r360
          base64 -d /tmp/r360/signing/research360-release.p12.b64 > /tmp/r360/signing/research360-release.p12
          test -f /tmp/r360/app/build.gradle
          test -f /tmp/r360/signing/research360-release.p12

      - name: Apply v1.2 compile fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/r360/app/src/main/java/com/suhas/research360engine/MainActivity.java')
          s = p.read_text()
          old = 'private TextView r360Confidence,ownConfidence,status,stats,logs,gate,connection,ipStatus,r360Top,ownTop;'
          new = 'private TextView r360Confidence,ownConfidence,status,stats,logs,gate,connection,ipStatus,apiStatus,r360Top,ownTop;'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'apiStatus' not in s.split('private Switch',1)[0]:
              raise SystemExit('Unable to apply apiStatus declaration fix')
          p.write_text(s)
          PY

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r360
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/r360/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          mkdir -p research360-build/apk-parts
          rm -f research360-build/apk-parts/part*
          sha256sum "$APK" | sed 's#  .*#  Research360-Intelligence-LG-G7-ThinQ-v1.2.0-FINAL.apk#' > research360-build/APK-SHA256-v1.2.0.txt
          cp /tmp/apksigner.txt research360-build/APK-SIGNATURE-VERIFICATION-v1.2.0.txt
          base64 -w 100 "$APK" > research360-build/Research360-v1.2.0-FINAL.apk.b64
          base64 -w 0 "$APK" > /tmp/research360-v1.2.0.apk.b64
          split -b 8000 -d -a 2 /tmp/research360-v1.2.0.apk.b64 research360-build/apk-parts/part
          printf 'APK_SIZE_BYTES=%s\n' "$(stat -c%s "$APK")" > research360-build/BUILD-INFO-v1.2.0.txt
          printf 'APK_PART_COUNT=%s\n' "$(find research360-build/apk-parts -type f -name 'part*' | wc -l)" >> research360-build/BUILD-INFO-v1.2.0.txt
          printf 'APK_B64_LINES=%s\n' "$(wc -l < research360-build/Research360-v1.2.0-FINAL.apk.b64)" >> research360-build/BUILD-INFO-v1.2.0.txt

      - name: Commit build output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Research360 Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research360-build/apk-parts research360-build/Research360-v1.2.0-FINAL.apk.b64 research360-build/APK-SHA256-v1.2.0.txt research360-build/APK-SIGNATURE-VERIFICATION-v1.2.0.txt research360-build/BUILD-INFO-v1.2.0.txt
          git commit -m 'Build Research360 v1.2.0 APK [skip ci]' || exit 0
          git push origin HEAD:research360-build-v1.2.0
