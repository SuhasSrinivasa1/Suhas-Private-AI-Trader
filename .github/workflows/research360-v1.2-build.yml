name: Research360 v1.3 APK Build

on:
  push:
    branches:
      - research360-build-v1.3.0
    paths:
      - 'research360-build/v1.3/**'
      - '.github/workflows/research360-v1.2-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore v1.2 base source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r360
          mkdir -p /tmp/r360
          cat research360-build/source/part* > /tmp/r360-src.b64
          base64 -d /tmp/r360-src.b64 > /tmp/r360-src.tar.gz
          tar -xzf /tmp/r360-src.tar.gz -C /tmp/r360
          base64 -d /tmp/r360/signing/research360-release.p12.b64 > /tmp/r360/signing/research360-release.p12
          test -f /tmp/r360/app/build.gradle
          test -f /tmp/r360/signing/research360-release.p12

      - name: Apply v1.2 compile correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r360/app/src/main/java/com/suhas/research360engine/MainActivity.java')
          s=p.read_text()
          old='private TextView r360Confidence,ownConfidence,status,stats,logs,gate,connection,ipStatus,r360Top,ownTop;'
          new='private TextView r360Confidence,ownConfidence,status,stats,logs,gate,connection,ipStatus,apiStatus,r360Top,ownTop;'
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif 'apiStatus' not in s.split('private Switch',1)[0]:
              raise SystemExit('Unable to apply apiStatus declaration fix')
          PY

      - name: Apply v1.3 sector-momentum upgrade
        shell: bash
        run: |
          set -euo pipefail
          base64 -d research360-build/v1.3/apply_v13.py.gz.b64 | gzip -dc > /tmp/apply_v13.py
          python3 /tmp/apply_v13.py
          mkdir -p /tmp/r360/app/src/main/java/com/suhas/research360engine
          cat research360-build/v1.3/sector_chunk0 research360-build/v1.3/sector_chunk1 research360-build/v1.3/sector_chunk2 > /tmp/sector.b64
          base64 -d /tmp/sector.b64 | gzip -dc > /tmp/r360/app/src/main/java/com/suhas/research360engine/SectorMomentumScanner.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r360/app/src/main/java/com/suhas/research360engine/Db.java')
          s=p.read_text()
          old='COALESCE(SUM(CASE WHEN t.net_pnl>=100 THEN 1 ELSE 0 END),0)'
          new='COUNT(DISTINCT CASE WHEN t.net_pnl>=100 THEN t.id END)'
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -q "versionName '1.3.0'" /tmp/r360/app/build.gradle
          grep -q 'VERSION = 3' /tmp/r360/app/src/main/java/com/suhas/research360engine/Db.java
          grep -q 'SECTOR MOMENTUM — TOP 3' /tmp/r360/app/src/main/java/com/suhas/research360engine/MainActivity.java
          grep -q 'SECTOR_MOMENTUM_INTRADAY' /tmp/r360/app/src/main/java/com/suhas/research360engine/SectorMomentumScanner.java

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r360
          gradle assembleRelease lint --no-daemon --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/r360/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/APK-SIGNATURE-VERIFICATION-v1.3.0.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/APK-BADGING-v1.3.0.txt
          grep -q "versionName='1.3.0'" /tmp/APK-BADGING-v1.3.0.txt
          grep -q "sdkVersion:'26'" /tmp/APK-BADGING-v1.3.0.txt
          cp "$APK" /tmp/Research360-Intelligence-LG-G7-ThinQ-v1.3.0-FINAL.apk
          sha256sum /tmp/Research360-Intelligence-LG-G7-ThinQ-v1.3.0-FINAL.apk | tee /tmp/APK-SHA256-v1.3.0.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Research360-Intelligence-LG-G7-ThinQ-v1.3.0-FINAL
          path: |
            /tmp/Research360-Intelligence-LG-G7-ThinQ-v1.3.0-FINAL.apk
            /tmp/APK-SHA256-v1.3.0.txt
            /tmp/APK-SIGNATURE-VERIFICATION-v1.3.0.txt
            /tmp/APK-BADGING-v1.3.0.txt
          if-no-files-found: error
          retention-days: 30
